<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Türkiye Yaşam Simülatörü - Neşeli Sürüm</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Eğlenceli ve modern font: Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            /* Aydınlık, keyifli ve canlı arka plan gradiyenti */
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #334155; /* Yumuşak koyu gri metin */
        }

        /* Özel Kaydırma Çubuğu */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ff758c; border-radius: 10px; }

        /* Mobil Uygulama Çerçevesi */
        .app-container {
            width: 100%;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        @media (min-width: 640px) {
            .app-container {
                width: 400px;
                height: 850px;
                max-height: 95vh;
                border-radius: 2.5rem;
                border: 8px solid #ffffff;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0,0,0,0.05);
            }
        }

        /* Eğlenceli Arka Plan Desenleri (Uçuşan şekiller) */
        .bg-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.4;
            background-image: radial-gradient(#ff758c 1.5px, transparent 1.5px), radial-gradient(#ff758c 1.5px, transparent 1.5px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            pointer-events: none;
            z-index: 0;
        }

        /* --- BEYAZ, AYDINLIK KART TASARIMI --- */
        .card-perspective {
            perspective: 1000px;
        }

        .main-card {
            width: 100%;
            max-width: 260px;
            aspect-ratio: 2 / 2.8;
            background: #ffffff;
            border-radius: 24px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), inset 0 0 0 2px rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s, border-color 0.3s;
            transform-style: preserve-3d;
            margin: auto;
            border: 4px dashed transparent;
        }

        /* Sürükle-Bırak Hedef Alanı Parlaması */
        .main-card.drop-hover {
            transform: scale(1.05);
            border-color: #4ade80; /* Açık yeşil border */
            box-shadow: 0 25px 50px rgba(74, 222, 128, 0.3), 0 0 30px rgba(74, 222, 128, 0.2);
            background: #f0fdf4; /* Hafif yeşil arka plan */
        }

        /* Kart Animasyon Sınıfları */
        .card-idle { transform: scale(1) rotateY(0deg); opacity: 1; }
        .card-flip-out { transform: scale(0.9) rotateY(-90deg) translateY(-20px); opacity: 0; }
        .card-flip-in { transform: scale(0.9) rotateY(90deg) translateY(20px); opacity: 0; }

        /* Seçenek Kartları (Yelpaze Formatı) */
        .fan-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            height: 200px;
            position: relative;
            padding-bottom: 2rem;
        }

        .choice-draggable-card {
            width: 95px;
            aspect-ratio: 2 / 2.8;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.06);
            color: #475569;
            cursor: grab;
            transform-origin: bottom center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            /* Mobilde sürüklerken sayfanın kaymasını engellemek için önemli */
            touch-action: none; 
        }
        
        .choice-draggable-card:active {
            cursor: grabbing;
        }

        /* Sürüklenirken kartın görünümü */
        .choice-draggable-card.dragging {
            box-shadow: 0 30px 60px rgba(0,0,0,0.15), 0 0 0 2px #ff758c;
            opacity: 0.95;
            background: #fff0f2;
        }

        .choice-draggable-card:disabled {
            opacity: 0.5;
            filter: grayscale(100%);
            border-color: #cbd5e1;
            cursor: not-allowed;
            touch-action: auto;
        }

        /* Uçan Değerler */
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(10px) scale(0.8); }
            20% { opacity: 1; transform: translateY(0) scale(1.2); }
            100% { opacity: 0; transform: translateY(-40px) scale(1); }
        }
        .stat-float {
            position: absolute;
            top: 30px;
            font-weight: 900;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
            z-index: 50;
            text-shadow: 0 2px 4px rgba(255,255,255,0.8);
        }

        .modal-enter { animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Toast Animasyonları */
        @keyframes toastEnter {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes toastLeave {
            from { transform: translateY(0); opacity: 1; }
            to { transform: translateY(-20px); opacity: 0; }
        }
        .toast-enter { animation: toastEnter 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .toast-leave { animation: toastLeave 0.3s ease-in forwards; }

        /* --- KARANLIK (DARK) MOD STİLLERİ --- */
        body.dark-theme {
            background: linear-gradient(135deg, #1e1e2f 0%, #151520 100%);
            color: #f8fafc;
        }
        body.dark-theme .app-container {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.4) 100%);
            border-color: #334155;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.05);
        }
        body.dark-theme .main-card, body.dark-theme .choice-draggable-card {
            background: #1e293b;
            border-color: #475569;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            color: #f1f5f9;
        }
        body.dark-theme .choice-draggable-card span.text-slate-700 {
            color: #e2e8f0;
        }
        body.dark-theme .choice-draggable-card.dragging {
            background: #334155;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 2px #ff758c;
        }
        body.dark-theme .main-card p.text-slate-600 {
            color: #cbd5e1;
        }
        body.dark-theme .bg-white\/50, body.dark-theme .bg-white\/30, body.dark-theme .bg-white\/70, body.dark-theme .bg-white\/90 {
            background-color: rgba(30, 41, 59, 0.7);
            border-color: rgba(255, 255, 255, 0.15);
            color: #f1f5f9;
        }
        body.dark-theme .drop-hover {
            background: #064e3b;
            border-color: #4ade80;
        }
        body.dark-theme .toast-enter, body.dark-theme .toast-leave {
            background-color: rgba(30, 41, 59, 0.95);
            border-color: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Başlangıç değerleri (Gün kaldırıldı, Yas ve Aile eklendi)
        const INITIAL_STATS = { para: 0, mutluluk: 70, saglik: 100, tecrube: 0, yas: 0, secimSayaci: 0, aileIliski: 80 };

        // Rastgele kardeş ve aile refahı hesaplama
        const generateFamily = () => {
            const count = Math.floor(Math.random() * 4); // 0 ile 3 arası kardeş
            const types = ["Abi", "Abla", "Küçük Erkek Kardeş", "Küçük Kız Kardeş"];
            let siblings = [];
            for(let i=0; i<count; i++) siblings.push(types[Math.floor(Math.random()*types.length)]);
            
            // Kardeş arttıkça evin harçlık kapasitesi düşer (Kardeş başı %15 azalma)
            const wealthMultiplier = 1 - (count * 0.15); 
            return { siblings, wealthMultiplier, count };
        };

        // Yaşa duyarlı rastgele olaylar
        const RANDOM_EVENTS = [
            { minAge: 0, maxAge: 4, text: "Yatağından düştün!", effect: { saglik: -10, mutluluk: -5 } },
            { minAge: 0, maxAge: 4, text: "Altına yaptın, ailenin uykusu bölündü.", effect: { aileIliski: -5 } },
            { minAge: 5, maxAge: 14, text: "Okulda sıraya sakız yapıştırdığın için azar işittin.", effect: { mutluluk: -15, aileIliski: -5 } },
            { minAge: 7, maxAge: 18, text: "Akrabalar ziyarete geldi, zorla el öptün ve harçlık aldın.", effect: { para: 100, mutluluk: -5, aileIliski: 5 } },
            { minAge: 18, maxAge: 99, text: "Yolda yürürken 50 TL buldun!", effect: { para: 50, mutluluk: 5 } },
            { minAge: 15, maxAge: 99, text: "Otobüse binerken akbilin boş çıktı, rezil oldun.", effect: { mutluluk: -10 } },
            { minAge: 18, maxAge: 99, text: "Ucuz tavuk döner zehirledi.", effect: { saglik: -15, mutluluk: -5, para: -30 } },
            { minAge: 5, maxAge: 99, text: "Sokak kedisi sevip stres attın.", effect: { mutluluk: 15 } },
            { minAge: 0, maxAge: 99, text: "Grip oldun, burnun akıyor.", effect: { saglik: -10, para: -20 } },
            { minAge: 12, maxAge: 99, condition: (stats) => stats.aileIliski < 30, text: "Ailen sana çok sert çıktı ve kavga ettiniz.", effect: { aileIliski: -15, mutluluk: -10 } }
        ];

        const StatHeader = ({ icon, value, type, suffix = "", colorClass }) => {
            const isDanger = (type === 'saglik' && value <= 30) || 
                             (type === 'mutluluk' && value === 0) || 
                             (type === 'para' && value <= -500) ||
                             (type === 'aile' && value <= 30);
            const displayColor = isDanger ? 'text-red-500' : colorClass;

            return (
                <div className="flex flex-col items-center relative bg-white/50 backdrop-blur-sm px-2 sm:px-3 py-1 sm:py-1.5 rounded-2xl shadow-sm border border-white/60">
                    <i className={`fas ${icon} text-base sm:text-lg mb-0.5 sm:mb-1 ${displayColor}`}></i>
                    <span className={`text-xs sm:text-sm font-black ${displayColor}`}>{value}{suffix}</span>
                </div>
            );
        };

        const App = () => {
            const [stats, setStats] = useState(INITIAL_STATS);
            const [familyInfo, setFamilyInfo] = useState(generateFamily());
            const [currentEventId, setCurrentEventId] = useState('hub_baby');
            const [isGameOver, setIsGameOver] = useState(false);
            const [toasts, setToasts] = useState([]);
            const [isDarkMode, setIsDarkMode] = useState(false);
            
            const [animState, setAnimState] = useState('card-idle');
            const [displayEventId, setDisplayEventId] = useState('hub_baby');

            const [dragState, setDragState] = useState({
                isDragging: false, index: null, startX: 0, startY: 0, currentX: 0, currentY: 0,
            });
            const [isHoveringDropZone, setIsHoveringDropZone] = useState(false);
            const dropZoneRef = useRef(null);

            // Tüm Hikaye ve Seçim Ağı (Dinamik Yaş Sistemi)
            const EVENTS = {
                hub_baby: {
                    id: 'hub_baby', emoji: '👶', title: "Bebeklik Yılları",
                    description: `Şu an ${stats.yas} yaşındasın. ${familyInfo.count > 0 ? familyInfo.siblings.join(', ') + ' ile birlikte' : 'Evin tek çocuğu olarak'} büyüyorsun.${stats.aileIliski < 30 ? ' Evde sürekli gergin bir hava var, ailen pek ilgilenmiyor.' : ''}`,
                    choices: [
                        { text: "Ağla", nextId: 'baby_cry', step: 1, icon: '😭' },
                        { text: "Uyu", nextId: 'baby_sleep', step: 1, icon: '😴' },
                        { text: "Dağıt", nextId: 'baby_mess', step: 1, icon: '🧸' }
                    ]
                },
                baby_cry: {
                    id: 'baby_cry', emoji: '🍼', title: "İlgi Çekme",
                    description: "Avazın çıktığı kadar ağladın. Ailen mecburen seninle ilgilendi.",
                    effect: { aileIliski: 2, saglik: -2, mutluluk: 5 },
                    choices: [{ text: "Devam", nextId: 'hub', icon: '👍' }]
                },
                baby_sleep: {
                    id: 'baby_sleep', emoji: '💤', title: "Büyüme Uykusu",

                hub_child: {

                    description: `Şu an ${stats.yas} yaşındasın. Yürümeyi ve konuşmayı çözdün.${stats.aileIliski < 30 ? ' Ailen sana çok kaba davranıyor, hep bağırıyorlar.' : ''}`,
                    choices: [
                        { text: "Parkta Oyna", nextId: 'child_play', step: 1, icon: '🛝' },

                },
                child_play: {

                    effect: { aileIliski: 15, mutluluk: -5 },
                    choices: [{ text: "Devam", nextId: 'hub', icon: '👍' }]
                },

                hub_school: {
                    id: 'hub_school', emoji: '🎒', title: "Okul Çağı",
                    description: `${stats.yas} yaşındasın. Haftalık harçlıkların yatmaya başladı!${stats.aileIliski < 30 ? ' Evdeki huzursuzluk okul başarını etkiliyor.' : ''}`,
                    choices: [
                        { text: "Ders Çalış", nextId: 'school_study', step: 1, icon: '📚' },
                        { text: "Oyun Oyna", nextId: 'school_game', step: 1, icon: '🎮' },
                        { text: "Ev İşine Yardım", nextId: 'school_help', step: 1, icon: '🧹' }
                    ]
                },
                school_study: {
                    id: 'school_study', emoji: '🤓', title: "İnekleme",
                    description: "Ödevlerini eksiksiz yaptın. Sıkıcıydı ama zihnin açıldı.",
                    effect: { tecrube: 15, mutluluk: -10, aileIliski: 5 },
                    choices: [{ text: "Devam", nextId: 'hub', icon: '👍' }]
                },
                school_game: {
                    id: 'school_game', emoji: '🕹️', title: "Ekran Bağımlısı",
                    description: "Gözlerin kızarana kadar bilgisayar oynadın. Ailen biraz söylendi.",
                    effect: { mutluluk: 20, tecrube: -5, aileIliski: -10, saglik: -5 },
                    choices: [{ text: "Devam", nextId: 'hub', icon: '👍' }]
                },
                school_help: {
                    id: 'school_help', emoji: '💖', title: "Hayırlı Evlat",
                    description: "Annene/Babana temizlikte yardım ettin. Sana fazladan nakit ateşlediler!",
                    effect: { aileIliski: 20, para: 50, mutluluk: -5 },
                    choices: [{ text: "Devam", nextId: 'hub', icon: '👍' }]
                },

                hub_teen: {
                    id: 'hub_teen', emoji: '🎧', title: "Ergenlik",
                    description: `${stats.yas} yaşındasın. Kanın deli akıyor. Ailenle çatışmaların artabilir.${stats.aileIliski < 30 ? ' Sürekli kavga ediyorsunuz, evi terk etmenin eşiğindesin.' : ''}`,
                    choices: [
                        { text: "Sınava Kas", nextId: 'teen_exam', step: 1, icon: '📖' },
                        { text: "İsyankar Takıl", nextId: 'teen_rebel', step: 1, icon: '🤘' },

                teen_exam: {

                teen_hangout: {
                    id: 'teen_hangout', emoji: '🍕', title: "Sokak Çocuğu",
                    description: "Arkadaşlarla buluşup fast food gömdünüz. Cüzdan hafifledi.",
                    effect: { para: -100, mutluluk: 20, saglik: -10 },
                    choices: [{ text: "Devam", nextId: 'hub', icon: '👍' }]
                },

                hub_adult: {
                    id: 'hub_adult', emoji: '🏢', title: "Yetişkinlik",
                    description: `${stats.yas} yaşındasın. Artık kendi ayakların üzerinde durma vakti.${stats.aileIliski < 30 ? ' Ailenle arana soğukluk girdi, pek görüşmüyorsunuz.' : ' Ailen arkanda, sana hep destek oluyorlar.'}`,
                    choices: [
                        { text: "İş Ara", nextId: 'job_hunt', step: 1, icon: '💼' },
                        { text: "Dışarı Çık", nextId: 'hangout', step: 1, icon: '🏃' },
                        { text: "Ziyaret Et", nextId: 'adult_family', step: 1, icon: '👨‍👩‍👧‍👦' }
                    ]
                },
                adult_family: {
                    id: 'adult_family', emoji: '☕', title: "Sıla-i Rahim",
                    description: "Aileni ziyarete gittin, çay içip dertleştiniz. Bağlarınız güçlendi.",
                    effect: { aileIliski: 20, mutluluk: 10, para: -20 },
                    choices: [{ text: "Devam", nextId: 'hub', icon: '👍' }]
                },

                job_hunt: {
                    id: 'job_hunt', emoji: '🏢', title: "Kariyer Hedefleri",
                    description: "İş aramak için dışarı çıktın. Birkaç yer geri dönüş yaptı, hangisi?",
                    effect: { mutluluk: -5, tecrube: 5 },
                    choices: [
                        { text: "Kasiyer", nextId: 'work_cashier', step: 1, icon: '🛒' },
                        { text: "Garson", nextId: 'work_waiter', step: 1, icon: '🍽️' },
                        { text: "Freelance", nextId: 'freelance_try', step: 1, icon: '💻' }
                    ]
                },
                work_cashier: {
                    id: 'work_cashier', emoji: '🛍️', title: "Kasa Nöbeti",
                    description: "Bütün gün 'Bozuk var mı?' diye sordun. Ayaklara kara sular indi.",

                    choices: [{ text: "Günü bitir", nextId: 'hub', icon: '🌙' }]
                },
                work_waiter: {

                },
                freelance_try: {

                    description: "İnternetten müşteri bulmaya çalıştın...",
                    effect: (stats) => {
                        if (Math.random() > 0.6) return { effect: { para: 400, mutluluk: 20, tecrube: 10 }, msg: "Harika! Yeni bir müşteri buldun." };
                        return { effect: { mutluluk: -10, saglik: -5 }, msg: "Bugün şansın yaver gitmedi, müşteri bulamadın." };
                    },
                    choices: [{ text: "Tamam", nextId: 'hub', icon: '👍' }]
                },
                hangout: {
                    id: 'hangout', emoji: '🎈', title: "Sokakların Sesi",
                    description: "Nereye gidip biraz hava almak istersin?",
                    choices: [
                        { text: "Kahve (100₺)", nextId: 'cafe', req: { para: 100 }, step: 1, icon: '☕' },
                        { text: "Sahil (30₺)", nextId: 'beach', req: { para: 30 }, step: 1, icon: '🌊' },
                        { text: "Parkta Yürü", nextId: 'walk', step: 1, icon: '🌳' }
                    ]
                },
                cafe: {
                    id: 'cafe', emoji: '🍰', title: "Keyif Molası",
                    description: "Harika bir kahve içip tatlı yedin. Moralin tavan yaptı.",
                    effect: { para: -100, mutluluk: 25, saglik: -2 },
                    choices: [{ text: "Geri dön", nextId: 'hub', icon: '🏠' }]
                },
                beach: {
                    id: 'beach', emoji: '🏖️', title: "Deniz Havası",
                    description: "Sahilde martılara simit atıp, rüzgarı hissettin.",
                    effect: { para: -30, mutluluk: 15, saglik: 5 },
                    choices: [{ text: "Geri dön", nextId: 'hub', icon: '🏠' }]
                },
                walk: {
                    id: 'walk', emoji: '👟', title: "Doğa Yürüyüşü",
                    description: "Parkta uzun bir yürüyüş yaptın. Kuş sesleri eşliğinde kafanı dinledin.",
                    effect: { mutluluk: 5, saglik: 10 },
                    choices: [{ text: "Geri dön", nextId: 'hub', icon: '🏠' }]
                },
                game_over_money: {
                    id: 'game_over_money', emoji: '💸', title: "İFLAS",
                    description: "Borç batağına saplandın... Eksi 1000 TL'yi gördün ve tutunamadın.",
                    isGameOver: true, choices: [{ text: "Yeniden Başla", nextId: 'reset', icon: '🔄' }]
                },
                game_over_health: {
                    id: 'game_over_health', emoji: '🚑', title: "ŞİFA TALEBİ",
                    description: "Sağlığına hiç dikkat etmedin. Hastanelik oldun, oyun bitti.",
                    isGameOver: true, choices: [{ text: "Yeniden Başla", nextId: 'reset', icon: '🔄' }]
                },
                game_over_family: {
                    id: 'game_over_family', emoji: '🚪', title: "EVDEN KOVULDUN",
                    description: "Ailenle bağların tamamen koptu! Seni kapının önüne koydular. Hayata tek başına tutunamadın...",
                    isGameOver: true, choices: [{ text: "Yeniden Doğ", nextId: 'reset', icon: '🔄' }]
                }
            };

            useEffect(() => {
                if (isDarkMode) document.body.classList.add('dark-theme');
                else document.body.classList.remove('dark-theme');
            }, [isDarkMode]);

            // Oyun Sonu Kontrolleri
            useEffect(() => {
                if (isGameOver) return;
                if (stats.para <= -1000) triggerEventChange('game_over_money');
                else if (stats.saglik <= 0) triggerEventChange('game_over_health');
                else if (stats.aileIliski <= 0) triggerEventChange('game_over_family');
            }, [stats, isGameOver]);

            const addToast = (messages) => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, messages, leaving: false }]);
                setTimeout(() => {
                    setToasts(prev => prev.map(t => t.id === id ? { ...t, leaving: true } : t));
                    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 300);
                }, 2500);
            };

            const triggerEventChange = (nextId) => {
                setAnimState('card-flip-out');
                setTimeout(() => {
                    setDisplayEventId(nextId);
                    setAnimState('card-flip-in');
                    requestAnimationFrame(() => requestAnimationFrame(() => setAnimState('card-idle')));
                }, 300);
            };

            const handlePointerDown = (e, index, isDisabled) => {
                if (isDisabled || animState !== 'card-idle') return;
                e.target.setPointerCapture(e.pointerId);
                setDragState({ isDragging: true, index: index, startX: e.clientX, startY: e.clientY, currentX: e.clientX, currentY: e.clientY });
            };

            const handlePointerMove = (e) => {
                if (!dragState.isDragging) return;
                setDragState(prev => ({ ...prev, currentX: e.clientX, currentY: e.clientY }));
                if (dropZoneRef.current) {
                    const rect = dropZoneRef.current.getBoundingClientRect();
                    const isInside = (
                        e.clientX >= rect.left - 20 && e.clientX <= rect.right + 20 &&
                        e.clientY >= rect.top - 20 && e.clientY <= rect.bottom + 40 
                    );
                    setIsHoveringDropZone(isInside);
                }
            };

            const handlePointerUp = (e) => {
                if (!dragState.isDragging) return;
                e.target.releasePointerCapture(e.pointerId);
                if (isHoveringDropZone && dropZoneRef.current) {
                    const choice = EVENTS[displayEventId].choices[dragState.index];
                    handleChoice(choice);
                }
                setDragState({ isDragging: false, index: null, startX: 0, startY: 0, currentX: 0, currentY: 0 });
                setIsHoveringDropZone(false);
            };

            const handleChoice = (choice) => {
                if (choice.nextId === 'reset') {
                    setStats(INITIAL_STATS);
                    setFamilyInfo(generateFamily());
                    setIsGameOver(false);
                    setToasts([]);
                    triggerEventChange('hub_baby');
                    return;
                }

                let newStats = { ...stats };
                let diffs = { para: 0, mutluluk: 0, saglik: 0, aileIliski: 0 };
                let toastMessages = [];

                // Yaş & Adım Mekaniği
                if (choice.step > 0) {
                    newStats.secimSayaci += choice.step;
                    
                    // 5-14 Yaş Arası Harçlık
                    if (newStats.yas >= 5 && newStats.yas <= 14) {
                         const baseAllowance = 15 * newStats.yas; 
                         const actualAllowance = Math.floor(baseAllowance * familyInfo.wealthMultiplier);
                         newStats.para += actualAllowance;
                         diffs.para += actualAllowance;
                    }

                    // Rastgele Olaylar
                    if (Math.random() < 0.35) {
                        const possibleEvents = RANDOM_EVENTS.filter(e => 
                            newStats.yas >= e.minAge && 
                            newStats.yas <= e.maxAge &&
                            (!e.condition || e.condition(newStats))
                        );
                        if(possibleEvents.length > 0) {
                            const rnd = possibleEvents[Math.floor(Math.random() * possibleEvents.length)];
                            if (rnd.effect.para) { newStats.para += rnd.effect.para; diffs.para += rnd.effect.para; }
                            if (rnd.effect.mutluluk) { newStats.mutluluk += rnd.effect.mutluluk; diffs.mutluluk += rnd.effect.mutluluk; }
                            if (rnd.effect.saglik) { newStats.saglik += rnd.effect.saglik; diffs.saglik += rnd.effect.saglik; }
                            if (rnd.effect.aileIliski) { newStats.aileIliski += rnd.effect.aileIliski; diffs.aileIliski += rnd.effect.aileIliski; }
                            toastMessages.push({ icon: 'fa-bolt', text: rnd.text, color: 'text-sky-500' });
                        }
                    }

                    // 5 Adımda Bir Yaş Atla
                    if (newStats.secimSayaci >= 5) {
                        newStats.yas += 1;
                        newStats.secimSayaci = 0;
                    }
                }

                // Hub Rotasyon Matematiği
                let targetId = choice.nextId;
                if (targetId === 'hub') {
                    if (newStats.yas <= 3) targetId = 'hub_baby';
                    else if (newStats.yas <= 6) targetId = 'hub_child';
                    else if (newStats.yas <= 14) targetId = 'hub_school';
                    else if (newStats.yas <= 18) targetId = 'hub_teen';
                    else targetId = 'hub_adult';
                }

                let nextEvent = EVENTS[targetId];

                // Kartın getirdiği etkiler
                if (nextEvent && nextEvent.effect) {
                    let effectToApply = nextEvent.effect;
                    if (typeof nextEvent.effect === 'function') {
                        const res = nextEvent.effect(newStats);
                        effectToApply = res.effect;
                    }
                    if (effectToApply.para) { newStats.para += effectToApply.para; diffs.para += effectToApply.para; }
                    if (effectToApply.mutluluk) { newStats.mutluluk += effectToApply.mutluluk; diffs.mutluluk += effectToApply.mutluluk; }
                    if (effectToApply.saglik) { newStats.saglik += effectToApply.saglik; diffs.saglik += effectToApply.saglik; }
                    if (effectToApply.aileIliski) { newStats.aileIliski += effectToApply.aileIliski; diffs.aileIliski += effectToApply.aileIliski; }
                    if (effectToApply.tecrube) { newStats.tecrube += effectToApply.tecrube; }
                }

                // Depresyon: Mutluluk 0 ise Sağlık %10 düşer.
                if (stats.mutluluk <= 0 && diffs.mutluluk <= 0) {
                    newStats.saglik -= 10;
                    diffs.saglik -= 10;
                }

                // Sınırlandırmalar
                newStats.mutluluk = Math.max(0, Math.min(100, newStats.mutluluk));
                newStats.saglik = Math.max(0, Math.min(100, newStats.saglik));
                newStats.aileIliski = Math.max(0, Math.min(100, newStats.aileIliski));

                // Toastları Derle
                if (diffs.para !== 0) toastMessages.push({ icon: 'fa-coins', val: diffs.para, color: diffs.para > 0 ? 'text-amber-500' : 'text-red-500' });
                if (diffs.mutluluk !== 0) toastMessages.push({ icon: 'fa-face-smile', val: diffs.mutluluk, color: diffs.mutluluk > 0 ? 'text-pink-500' : 'text-red-500' });
                if (diffs.saglik !== 0) toastMessages.push({ icon: 'fa-heart', val: diffs.saglik, color: diffs.saglik > 0 ? 'text-rose-500' : 'text-red-500' });
                if (diffs.aileIliski !== 0) toastMessages.push({ icon: 'fa-users', val: diffs.aileIliski, color: diffs.aileIliski > 0 ? 'text-violet-500' : 'text-red-500' });
                
                if (toastMessages.length > 0) addToast(toastMessages);

                setStats(newStats);
                setCurrentEventId(targetId);
                
                if (!(newStats.para <= -1000 || newStats.saglik <= 0 || newStats.aileIliski <= 0)) {
                    triggerEventChange(targetId);
                } else {
                    setIsGameOver(true);
                }
            };

            const currentEvent = EVENTS[displayEventId];

            return (
                <div className="app-container">
                    <div className="bg-pattern"></div>
                    
                    <div className="absolute top-28 left-0 w-full flex flex-col items-center gap-2 z-50 pointer-events-none px-4">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`bg-white/90 backdrop-blur-md shadow-sm rounded-2xl px-5 py-2 border border-white flex gap-4 items-center justify-center flex-wrap transition-all max-w-[90vw] text-center ${toast.leaving ? 'toast-leave' : 'toast-enter'}`}>
                                {toast.messages.map((msg, i) => (
                                    <div key={i} className={`flex items-center gap-1.5 font-black text-sm ${msg.color}`}>
                                        <i className={`fas ${msg.icon}`}></i>
                                        {msg.text ? <span>{msg.text}</span> : <span>{msg.val > 0 ? '+' : ''}{msg.val}</span>}
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>

                    <div className="h-24 bg-white/30 backdrop-blur-md border-b border-white/50 flex items-center justify-between px-2 sm:px-4 z-20 shadow-sm relative rounded-b-[2rem] gap-1 sm:gap-2">
                        <StatHeader icon="fa-coins" value={stats.para} type="para" suffix=" ₺" colorClass="text-amber-500" />
                        <StatHeader icon="fa-face-smile" value={stats.mutluluk} type="mutluluk" suffix="%" colorClass="text-pink-500" />
                        <StatHeader icon="fa-heart" value={stats.saglik} type="saglik" suffix="%" colorClass="text-rose-500" />
                        <StatHeader icon="fa-users" value={stats.aileIliski} type="aile" suffix="%" colorClass="text-violet-500" />
                        
                        <div className="w-[1px] h-10 bg-gray-300 mx-1 hidden sm:block"></div>
                        
                        <div className="flex flex-col items-center justify-center bg-white/50 backdrop-blur-sm px-2 py-1 rounded-2xl shadow-sm border border-white/60 min-w-[60px]">
                            <i className="fas fa-birthday-cake text-sm mb-0.5 text-sky-500"></i>
                            <span className="text-[11px] font-black text-sky-600 leading-tight text-center">{stats.yas} Yaş<br/><span className="text-[9px] text-sky-400">({stats.secimSayaci}/5)</span></span>
                        </div>
                        
                        <button onClick={() => setIsDarkMode(!isDarkMode)} className="ml-0.5 w-10 h-10 rounded-full bg-white/70 border border-white/60 shadow-sm flex items-center justify-center active:scale-90 transition-transform shrink-0">
                            <i className={`fas ${isDarkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-500'}`}></i>
                        </button>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center p-4 z-10 card-perspective w-full h-full relative">
                        <div ref={dropZoneRef} className={`main-card ${animState} ${isHoveringDropZone ? 'drop-hover' : ''} z-10`}>
                            <div className="text-7xl mb-4 filter drop-shadow-md transition-transform duration-300 hover:scale-110 cursor-default">
                                {currentEvent.emoji}
                            </div>
                            <h2 className="font-extrabold text-2xl mb-3 text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 uppercase">
                                {currentEvent.title}
                            </h2>
                            <p className="text-[14px] text-slate-600 leading-relaxed font-semibold">
                                {currentEvent.description}
                            </p>
                            
                            {dragState.isDragging && !isHoveringDropZone && (
                                <div className="absolute inset-0 border-4 border-dashed border-sky-300 rounded-3xl opacity-50 animate-pulse pointer-events-none"></div>
                            )}
                        </div>
                    </div>

                    <div className="w-full z-20 pt-6 pb-6 flex justify-center">
                        <div className="fan-container">
                            {currentEvent.choices.map((choice, index) => {
                                let isDisabled = false;
                                let reqText = "";
                                if (choice.req) {
                                    for (const [key, value] of Object.entries(choice.req)) {
                                        if (stats[key] < value) { isDisabled = true; reqText = `(${value}${key==='para'?'₺':''})`; }
                                    }
                                }

                                const total = currentEvent.choices.length;
                                const middle = (total - 1) / 2;
                                const offset = index - middle;
                                const isThisCardDragging = dragState.isDragging && dragState.index === index;
                                const rotation = offset * 12;
                                const translateY = Math.abs(offset) * 12;
                                const zIndexBase = 10 + index;
                                const dragX = isThisCardDragging ? dragState.currentX - dragState.startX : 0;
                                const dragY = isThisCardDragging ? dragState.currentY - dragState.startY : 0;
                                const marginLeft = index === 0 ? '0' : '-35px';

                                return (
                                    <button 
                                        key={index}
                                        disabled={isDisabled}
                                        onPointerDown={(e) => handlePointerDown(e, index, isDisabled)}
                                        onPointerMove={handlePointerMove}
                                        onPointerUp={handlePointerUp}
                                        className={`choice-draggable-card ${isThisCardDragging ? 'dragging' : ''}`}
                                        style={{
                                            transform: isThisCardDragging 
                                                ? `translate(${dragX}px, ${dragY}px) scale(1.1) rotate(0deg)` 
                                                : `rotate(${rotation}deg) translateY(${translateY}px) scale(1)`,
                                            zIndex: isThisCardDragging ? 100 : zIndexBase,
                                            marginLeft: marginLeft,
                                            transition: isThisCardDragging ? 'none' : 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)'
                                        }}
                                    >
                                        <div className="pointer-events-none flex flex-col items-center w-full h-full justify-between">
                                            <span className="text-3xl mt-1">{choice.icon}</span>
                                            <span className="font-bold text-[13px] leading-snug mt-2 text-slate-700">
                                                {choice.text}
                                            </span>
                                            <div className="h-4 mt-1">
                                                {isDisabled ? (
                                                    <span className="text-[10px] font-black text-rose-500 bg-rose-100 px-2 py-0.5 rounded-full">{reqText}</span>
                                                ) : (
                                                    <span className={`text-[10px] font-bold text-gray-400 ${animState === 'card-idle' && !dragState.isDragging ? 'animate-pulse' : ''}`}>
                                                        SÜRÜKLE
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
