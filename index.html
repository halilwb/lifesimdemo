<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Türkiye Yaşam Simülatörü - Stat Sürümü</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Eğlenceli ve modern font: Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Nunito', sans-serif; margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #334155; overflow: hidden;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        .app-container {
            width: 100%; height: 100dvh; position: relative; overflow: hidden;
            display: flex; flex-direction: column;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }

        @media (min-width: 640px) {
            .app-container {
                width: 420px; height: 850px; max-height: 95vh;
                border-radius: 2.5rem; border: 8px solid #ffffff;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0,0,0,0.05);
            }
        }

        .bg-pattern {
            position: absolute; inset: 0; opacity: 0.4;
            background-image: radial-gradient(#3b82f6 1.5px, transparent 1.5px), radial-gradient(#3b82f6 1.5px, transparent 1.5px);
            background-size: 40px 40px; background-position: 0 0, 20px 20px;
            pointer-events: none; z-index: 0;
        }

        .card-perspective { perspective: 1000px; }
        .main-card {
            width: 100%; max-width: 280px; aspect-ratio: 2 / 2.8;
            background: #ffffff; border-radius: 24px; position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), inset 0 0 0 2px rgba(255,255,255,0.5);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 2rem; text-align: center;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s, border-color 0.3s;
            transform-style: preserve-3d; margin: auto; border: 4px dashed transparent;
        }
        .main-card.drop-hover {
            transform: scale(1.05); border-color: #4ade80;
            box-shadow: 0 25px 50px rgba(74, 222, 128, 0.3), 0 0 30px rgba(74, 222, 128, 0.2); background: #f0fdf4;
        }

        .card-idle { transform: scale(1) rotateY(0deg); opacity: 1; }
        .card-flip-out { transform: scale(0.9) rotateY(-90deg) translateY(-20px); opacity: 0; }
        .card-flip-in { transform: scale(0.9) rotateY(90deg) translateY(20px); opacity: 0; }

        .fan-container { display: flex; justify-content: center; align-items: flex-end; width: 100%; height: 180px; position: relative; padding-bottom: 2rem; }
        .choice-draggable-card {
            width: 90px; aspect-ratio: 2 / 2.8; background: #ffffff; border: 2px solid #e2e8f0; border-radius: 16px;
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 0.5rem; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.06); color: #475569; cursor: grab;
            transform-origin: bottom center; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; 
        }
        .choice-draggable-card:active { cursor: grabbing; }
        .choice-draggable-card.dragging { box-shadow: 0 30px 60px rgba(0,0,0,0.15), 0 0 0 2px #3b82f6; opacity: 0.95; background: #eff6ff; }
        .choice-draggable-card:disabled { opacity: 0.5; filter: grayscale(100%); border-color: #cbd5e1; cursor: not-allowed; touch-action: auto; }

        @keyframes toastEnter { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes toastLeave { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-20px); opacity: 0; } }
        .toast-enter { animation: toastEnter 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .toast-leave { animation: toastLeave 0.3s ease-in forwards; }

        body.dark-theme { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; }
        body.dark-theme .app-container { background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, rgba(30, 41, 59, 0.6) 100%); border-color: #334155; }
        body.dark-theme .main-card, body.dark-theme .choice-draggable-card { background: #1e293b; border-color: #475569; color: #f1f5f9; }
        body.dark-theme .choice-draggable-card.dragging { background: #334155; box-shadow: 0 30px 60px rgba(0,0,0,0.4), 0 0 0 2px #60a5fa; }
        body.dark-theme .bg-white\/50, body.dark-theme .bg-white\/30, body.dark-theme .bg-white\/70, body.dark-theme .bg-white\/90 { background-color: rgba(30, 41, 59, 0.7); border-color: rgba(255, 255, 255, 0.15); color: #f1f5f9; }
        body.dark-theme .drop-hover { background: #064e3b; border-color: #4ade80; }
        body.dark-theme .toast-enter, body.dark-theme .toast-leave { background-color: rgba(30, 41, 59, 0.95); border-color: rgba(255, 255, 255, 0.1); }

        /* Yeni Stat Sekmesi ve Alt Bar Stilleri */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%;
            height: 60px; background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.5);
            display: flex; justify-content: space-around; align-items: center; z-index: 40;
            border-bottom-left-radius: 2.5rem; border-bottom-right-radius: 2.5rem;
        }
        body.dark-theme .bottom-nav { background: rgba(30,41,59,0.8); border-top-color: #475569; }
        
        .nav-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 45%; height: 80%; border-radius: 12px; font-weight: 800; font-size: 11px;
            color: #64748b; transition: all 0.2s;
        }
        .nav-btn.active { color: #3b82f6; background: rgba(59,130,246,0.1); }
        body.dark-theme .nav-btn.active { color: #60a5fa; background: rgba(96,165,250,0.1); }
        .nav-btn i { font-size: 16px; margin-bottom: 2px; }

        .stats-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 60px);
            background: rgba(255,255,255,0.95); backdrop-filter: blur(15px); z-index: 35;
            display: flex; flex-direction: column; padding: 2rem 1.5rem;
            animation: slideUp 0.3s forwards; overflow-y: auto;
        }
        body.dark-theme .stats-overlay { background: rgba(15,23,42,0.95); color: #f1f5f9; }
        
        @keyframes slideUp { from { transform: translateY(10%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .stat-bar-bg { width: 100%; height: 12px; background: #e2e8f0; border-radius: 6px; overflow: hidden; margin-top: 4px; }
        body.dark-theme .stat-bar-bg { background: #334155; }
        .stat-bar-fill { height: 100%; transition: width 0.5s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TURKEY_CITIES = [
            "Adana", "Adıyaman", "Afyonkarahisar", "Ağrı", "Amasya", "Ankara", "Antalya", "Artvin", "Aydın", "Balıkesir", "Bilecik", "Bingöl", "Bitlis", "Bolu", "Burdur", "Bursa", "Çanakkale", "Çankırı", "Çorum", "Denizli", "Diyarbakır", "Edirne", "Elazığ", "Erzincan", "Erzurum", "Eskişehir", "Gaziantep", "Giresun", "Gümüşhane", "Hakkari", "Hatay", "Isparta", "Mersin", "İstanbul", "İzmir", "Kars", "Kastamonu", "Kayseri", "Kırklareli", "Kırşehir", "Kocaeli", "Konya", "Kütahya", "Malatya", "Manisa", "Kahramanmaraş", "Mardin", "Muğla", "Muş", "Nevşehir", "Niğde", "Ordu", "Rize", "Sakarya", "Samsun", "Siirt", "Sinop", "Sivas", "Tekirdağ", "Tokat", "Trabzon", "Tunceli", "Şanlıurfa", "Uşak", "Van", "Yozgat", "Zonguldak", "Aksaray", "Bayburt", "Karaman", "Kırıkkale", "Batman", "Şırnak", "Bartın", "Ardahan", "Iğdır", "Yalova", "Karabük", "Kilis", "Osmaniye", "Düzce"
        ];

        const INITIAL_STATS = { 
            para: 0, 
            mutluluk: 70, 
            saglik: 100, 
            tecrube: 0, 
            yas: 0, 
            secimSayaci: 0, 
            aileIliski: 80,
            okul: 50, // Okul başarısı
            barinma: 'aile', // 'aile', 'yurt', 'sokak'
            zeka: 0,
            karizma: 0,
            guc: 0,
            hareketsizlik: 0,
            sevgili: false
        };

        const generateFamily = () => {
            const count = Math.floor(Math.random() * 4); 
            const types = ["Abi", "Abla", "Küçük Erkek Kardeş", "Küçük Kız Kardeş"];
            let siblings = [];
            for(let i=0; i<count; i++) siblings.push(types[Math.floor(Math.random()*types.length)]);
            const wealthMultiplier = 1 - (count * 0.15); 
            return { siblings, wealthMultiplier, count };
        };

        // Etkileşimli (Karar gerektiren) Rastgele Olaylar
        const INTERACTIVE_RANDOM_EVENTS = [
            { 
                id: 'rnd_love', minAge: 15, maxAge: 40, 
                condition: (stats) => !stats.sevgili && Math.random() < (stats.karizma / 100),
                emoji: '💘', title: "Aşk Kapıyı Çaldı!",
                description: "Karizman sayesinde biriyle tanıştın ve aranızda müthiş bir elektriklenme oldu.",
                choices: [
                    { text: "Şans Ver", nextId: 'hub', step: 0, icon: '😍', effect: { sevgili: true, mutluluk: 20, para: -50 } },
                    { text: "Reddet", nextId: 'hub', step: 0, icon: '🤚', effect: { mutluluk: -5, karizma: 5 } }
                ]
            },
            { 
                id: 'rnd_wallet', minAge: 7, maxAge: 18, 
                emoji: '👛', title: "Cüzdan Buldun!",
                description: "Okul bahçesinde öğretmenin cüzdanını buldun. İçi para dolu görünüyor.",
                choices: [
                    { text: "Cukkalı", nextId: 'hub', step: 0, icon: '😈', effect: { para: 250, okul: -20, mutluluk: -10, aileIliski: -5 } },
                    { text: "Teslim Et", nextId: 'hub', step: 0, icon: '😇', effect: { okul: 15, mutluluk: 15, zeka: 5 } }
                ]
            },
            { 
                id: 'rnd_bully', minAge: 7, maxAge: 14, 
                emoji: '👊', title: "Zorbalık",
                description: "Okulda üst sınıflardan biri senden haraç istedi.",
                choices: [
                    { text: "Kavga Et", nextId: 'hub', step: 0, icon: '😡', effect: (s) => s.guc > 50 ? { effect: { mutluluk: 15, karizma: 10, tecrube: 10 }, msg: "Gücünle onları alt ettin!" } : { effect: { saglik: -20, mutluluk: -15 }, msg: "Fena dayak yedin..." } },
                    { text: "İkna Et", nextId: 'hub', step: 0, icon: '🗣️', effect: (s) => s.karizma > 60 ? { effect: { mutluluk: 5 }, msg: "Laf cambazlığıyla yırttın." } : { effect: { para: -20, mutluluk: -10, okul: -5 }, msg: "Dinlemediler, paranı aldılar." } }
                ]
            },
            { 
                id: 'rnd_dog', minAge: 4, maxAge: 99, 
                emoji: '🐕', title: "Sokak Köpeği",
                description: "Yolda yürürken iri bir sokak köpeği sana doğru koşmaya başladı.",
                choices: [
                    { text: "Kaç", nextId: 'hub', step: 0, icon: '🏃', effect: (s) => s.guc > 40 ? { effect: { mutluluk: -5 }, msg: "Hızlıca kaçtın." } : { effect: { saglik: -10, mutluluk: -10 }, msg: "Kaçamadın, ısırdı!" } },
                    { text: "Sev", nextId: 'hub', step: 0, icon: '🍖', effect: (s) => Math.random() > 0.5 ? { effect: { mutluluk: 20, karizma: 5 }, msg: "Çok uysalmış!" } : { effect: { saglik: -15 }, msg: "Seni ısırdı!" } }
                ]
            },
            { 
                id: 'rnd_sickness', minAge: 0, maxAge: 99, 
                emoji: '🤧', title: "Salgın",
                description: "Ortalıkta kötü bir grip salgını var ve sen de nasibini aldın. Ateşin çok yüksek.",
                choices: [
                    { text: "Dinlen", nextId: 'hub', step: 0, icon: '🛏️', effect: { saglik: 5, okul: -5, mutluluk: -5 } },
                    { text: "İlaç Al", nextId: 'hub', step: 0, icon: '💊', req: { para: 50 }, effect: { para: -50, saglik: 15 } },
                ]
            }
        ];

        const App = () => {
            const [gameState, setGameState] = useState('menu'); // 'menu', 'playing'
            const [availablePool, setAvailablePool] = useState([...TURKEY_CITIES]);
            const [currentChoicesCities, setCurrentChoicesCities] = useState([]);
            const [cityProgress, setCityProgress] = useState({}); // Şehir bazlı ilerleme ve zorluk kilitleri
            const [selectedCity, setSelectedCity] = useState('');
            const [difficulty, setDifficulty] = useState('kolay'); // kolay, orta, zor
            
            const [activeTab, setActiveTab] = useState('game'); // 'game', 'stats'

            const [stats, setStats] = useState(INITIAL_STATS);
            const [familyInfo, setFamilyInfo] = useState(generateFamily());
            const [isGameOver, setIsGameOver] = useState(false);
            const [toasts, setToasts] = useState([]);
            const [isDarkMode, setIsDarkMode] = useState(false);
            
            const [animState, setAnimState] = useState('card-idle');
            const [displayEventId, setDisplayEventId] = useState('hub_baby');

            const [dragState, setDragState] = useState({ isDragging: false, index: null, startX: 0, startY: 0, currentX: 0, currentY: 0 });
            const [isHoveringDropZone, setIsHoveringDropZone] = useState(false);
            const dropZoneRef = useRef(null);

            // TÜM OLAYLAR (Hub'lar ve Olaylar)
            const EVENTS = {
                // --- BEBEKLİK ---
                hub_baby: {
                    id: 'hub_baby', emoji: '👶', title: "Bebeklik",
                    description: `Şu an ${stats.yas} yaşındasın. ${familyInfo.count > 0 ? familyInfo.siblings.join(', ') + ' ile' : 'Tek çocuk olarak'} büyüyorsun.`,
                    choices: [
                        { text: "Ağla", nextId: 'hub', step: 1, icon: '😭', effect: { aileIliski: -2, mutluluk: 5 } },
                        { text: "Uyu", nextId: 'hub', step: 1, icon: '😴', effect: { saglik: 5, aileIliski: 2 } },
                        { text: "Dağıt", nextId: 'hub', step: 1, icon: '🧸', effect: { mutluluk: 10, aileIliski: -5, tecrube: 5 } }
                    ]
                },
                // --- ÇOCUKLUK ---
                hub_child: {
                    id: 'hub_child', emoji: '🧒', title: "Çocukluk",
                    description: `${stats.yas} yaşındasın. Enerjin hiç bitmiyor.`,
                    choices: [
                        { text: "Parkta Oyna", nextId: 'hub', step: 1, icon: '🛝', effect: { mutluluk: 15, saglik: -5, tecrube: 2, guc: 2, hareketsizlik: -99 } },
                        { text: "Kitap Kurcalat", nextId: 'hub', step: 1, icon: '📖', effect: { zeka: 5, mutluluk: -5, hareketsizlik: 1 } },
                        { text: "Uslu Dur", nextId: 'hub', step: 1, icon: '😇', effect: { aileIliski: 10, mutluluk: -5, karizma: 2, hareketsizlik: 1 } }
                    ]
                },
                // --- OKUL ÇAĞI ---
                hub_school: {
                    id: 'hub_school', emoji: '🎒', title: "İlköğretim",
                    description: `${stats.yas} yaşındasın. Okul başladı! Okul Başarısı: ${stats.okul}`,
                    choices: [
                        { text: "Ders Çalış", nextId: 'hub', step: 1, icon: '📚', effect: (s) => ({ effect: { okul: 15, zeka: 3, mutluluk: -10, hareketsizlik: 1 }, msg: s.zeka > 50 ? "Zekan sayesinde konuyu çabuk anladın." : "Anlamak biraz zor oldu." }) },
                        { text: "Satranç Kursu", nextId: 'hub', step: 1, icon: '♟️', effect: { zeka: 5, okul: 5, hareketsizlik: 1 } },
                        { text: "Spor Yap", nextId: 'hub', step: 1, icon: '⚽', effect: { guc: 5, saglik: 5, hareketsizlik: -99 } },
                        { text: "Oyun Oyna", nextId: 'hub', step: 1, icon: '🎮', effect: { mutluluk: 15, okul: -5, hareketsizlik: 1 } }
                    ]
                },
                // --- ERGENLİK ---
                hub_teen: {
                    id: 'hub_teen', emoji: '🎧', title: "Ergenlik",
                    description: `${stats.yas} yaşındasın. Lise sınavları, hormonlar... Hayat çok zor!`,
                    choices: [
                        { text: "Sınava Kas", nextId: 'hub', step: 1, icon: '📖', effect: { okul: 20, zeka: 3, mutluluk: -20, hareketsizlik: 1 } },
                        { text: "Sosyalleş", nextId: 'hub', step: 1, icon: '💬', effect: { karizma: 5, aileIliski: -5, mutluluk: 15 } },
                        { text: "Fastfood Ye", nextId: 'hub', step: 1, icon: '🍔', req: { para: 30 }, effect: { para: -30, guc: -5, saglik: -5, mutluluk: 20, hareketsizlik: 1 } },
                        { text: "Spor Salonu", nextId: 'hub', step: 1, icon: '🏋️', req: { para: 50 }, effect: { para: -50, guc: 10, karizma: 2, hareketsizlik: -99 } }
                    ]
                },
                teen_cheat: {
                    id: 'teen_cheat', emoji: '⚠️', title: "Riskli Hareket",
                    description: "Sınavda kopya çektin...",
                    effect: (s) => Math.random() > 0.5 ? { effect: { okul: 30, mutluluk: 10 }, msg: "Yakalanmadın!" } : { effect: { okul: -40, aileIliski: -30, mutluluk: -30 }, msg: "Hoca yakaladı, disipline gittin!" },
                    choices: [{ text: "Devam", nextId: 'hub', step: 0, icon: '👍' }]
                },
                // --- YETİŞKİNLİK ---
                hub_adult: {
                    id: 'hub_adult', emoji: '🏢', title: "Yetişkinlik",
                    description: `${stats.yas} yaşındasın. Hayat mücadelesi tam gaz devam ediyor.${stats.sevgili ? ' Sevgilinle mutlusun.' : ''}`,
                    choices: [
                        { text: "Çalış (Mesai)", nextId: 'adult_work', step: 1, icon: '💼' },
                        { text: "Belgesel İzle", nextId: 'hub', step: 1, icon: '📺', effect: { zeka: 5, mutluluk: 5, hareketsizlik: 1 } },
                        { text: "Spora Git", nextId: 'hub', step: 1, icon: '🏃', effect: { guc: 5, saglik: 10, hareketsizlik: -99 } },
                        { text: "Kişisel Bakım", nextId: 'hub', step: 1, icon: '✨', req: { para: 100 }, effect: { para: -100, karizma: 10, mutluluk: 15 } }
                    ]
                },
                adult_work: {
                    id: 'adult_work', emoji: '💵', title: "Maaş Günü",
                    description: "Maaşını aldın. İş yoğunluğu biraz yordu.",
                    effect: (s) => {
                        let base = difficulty === 'kolay' ? 500 : difficulty === 'orta' ? 300 : 150;
                        let zekaBonus = s.zeka > 60 ? 200 : 0;
                        let karizmaBonus = s.karizma > 60 ? 100 : 0;
                        let maas = base + zekaBonus + karizmaBonus + (s.tecrube * 2);
                        return { effect: { para: maas, saglik: -5, mutluluk: -5, tecrube: 2, hareketsizlik: 1 }, msg: `Hesabına yattı: ${maas}₺` };
                    },
                    choices: [{ text: "Devam", nextId: 'hub', step: 0, icon: '👍' }]
                },

                // --- YETİŞTİRME YURDU ---
                kicked_out_young: {
                    id: 'kicked_out_young', emoji: '🚪', title: "Evden Atıldın!",
                    description: "Ailenle ipler tamamen koptu! Yaşın 18'den küçük olduğu için devlet seni Yetiştirme Yurdu'na aldı.",
                    effect: { barinma: 'yurt', okul: -10, mutluluk: -30, karizma: -10 },
                    choices: [{ text: "Kabullen", nextId: 'hub', step: 0, icon: '😔' }]
                },
                hub_orphanage: {
                    id: 'hub_orphanage', emoji: '🏢', title: "Yetiştirme Yurdu",
                    description: `${stats.yas} yaşındasın. Yurt hayatı hiç kolay değil.`,
                    choices: [
                        { text: "Derslere Asıl", nextId: 'hub', step: 1, icon: '📚', effect: { okul: 15, zeka: 5, mutluluk: -5 } },
                        { text: "Kavga Et", nextId: 'hub', step: 1, icon: '🥊', effect: { saglik: -10, guc: 5, okul: -10 } },
                        { text: "Gizlice Çık", nextId: 'hub', step: 1, icon: '🌃', effect: { mutluluk: 20, saglik: -5, karizma: 5 } }
                    ]
                },
                orphanage_leave: {
                    id: 'orphanage_leave', emoji: '🎒', title: "Yurttan Ayrılış",
                    description: "18 yaşına bastın. Devlet yurdundan ayrılma vakti geldi. Cebinde biraz harçlıkla sokaklardasın.",
                    effect: { barinma: 'sokak', para: 1000 },
                    choices: [{ text: "Hayata Atıl", nextId: 'hub', step: 0, icon: '🚶' }]
                },

                // --- SOKAK / EVSİZ ---
                kicked_out_adult: {
                    id: 'kicked_out_adult', emoji: '🏚️', title: "Kapı Dışarı!",
                    description: "Ailen seni evden kovdu. Artık 18'den büyüksün, başının çaresine bakmalısın. Sokaktasın.",
                    effect: { barinma: 'sokak', mutluluk: -50 },
                    choices: [{ text: "Tamam", nextId: 'hub', step: 0, icon: '🌧️' }]
                },
                hub_street: {
                    id: 'hub_street', emoji: '🗑️', title: "Sokak Hayatı",
                    description: `${stats.yas} yaşındasın. Sokakta yaşamak çok yıpratıcı.`,
                    choices: [
                        { text: "Dilencilik", nextId: 'hub', step: 1, icon: '🤲', effect: { para: 50, karizma: -10, saglik: -5 } },
                        { text: "Hamallık Yap", nextId: 'hub', step: 1, icon: '🧱', effect: { para: 150, saglik: -15, guc: 5, hareketsizlik: -99 } },
                        { text: "Ev Tut (3000₺)", nextId: 'rent_house', step: 1, icon: '🏠', req: { para: 3000 } }
                    ]
                },
                rent_house: {
                    id: 'rent_house', emoji: '🔑', title: "Yeni Bir Başlangıç",
                    description: "Sonunda kendine ait küçük bir ev kiraladın! Artık sokakta değilsin.",
                    effect: { para: -3000, barinma: 'kendi_evi', mutluluk: 50, saglik: 30 },
                    choices: [{ text: "Harika!", nextId: 'hub', step: 0, icon: '🎉' }]
                },

                // --- GAME OVER EKRANLARI ---
                game_over_money: {
                    id: 'game_over_money', emoji: '💸', title: "İFLAS",
                    description: "Borç batağına saplandın. Tutunamadın...",
                    isGameOver: true, choices: [{ text: "Menüye Dön", nextId: 'menu', icon: '🏠' }]
                },
                game_over_health: {
                    id: 'game_over_health', emoji: '🚑', title: "HAYATINI KAYBETTİN",
                    description: "Sağlığın tükendi. Vücudun iflas etti.",
                    isGameOver: true, choices: [{ text: "Menüye Dön", nextId: 'menu', icon: '🏠' }]
                }
            };

            INTERACTIVE_RANDOM_EVENTS.forEach(ev => { EVENTS[ev.id] = ev; });

            useEffect(() => {
                if (isDarkMode) document.body.classList.add('dark-theme');
                else document.body.classList.remove('dark-theme');
            }, [isDarkMode]);

            // Ana Menü için 3 Rastgele Şehir Çekme
            const generateMenuCities = () => {
                let pool = [...availablePool];
                let choices = [];
                for(let i=0; i<3; i++) {
                    if(pool.length === 0) break;
                    const r = Math.floor(Math.random() * pool.length);
                    choices.push(pool[r]);
                    pool.splice(r, 1); // Seçileni listeden çıkar
                }
                setCurrentChoicesCities(choices);
            };

            useEffect(() => {
                if (gameState === 'menu' && currentChoicesCities.length === 0 && availablePool.length > 0) {
                    generateMenuCities();
                }
            }, [gameState]);

            const triggerGameOver = (reasonId) => {
                setIsGameOver(true);
                triggerEventChange(reasonId);
                
                // 40 yaş kuralı ve Şehir İlerlemesi kaydı
                setCityProgress(prev => {
                    const prog = prev[selectedCity] || { maxAge: 0, unlockedDiffs: ['kolay'] };
                    const newMax = Math.max(prog.maxAge, stats.yas);
                    let diffs = [...prog.unlockedDiffs];
                    
                    if (newMax >= 40) {
                        if (!diffs.includes('orta')) diffs.push('orta');
                        if (difficulty === 'orta' && !diffs.includes('zor')) diffs.push('zor');
                    }
                    return { ...prev, [selectedCity]: { maxAge: newMax, unlockedDiffs: diffs } };
                });
            };

            // Anlık Oyun Sonu Kontrolleri
            useEffect(() => {
                if (gameState !== 'playing' || isGameOver) return;
                
                // Sağlık 0 ise Anında Ölüm
                if (stats.saglik <= 0) {
                    triggerGameOver('game_over_health');
                    return;
                }
                
                // Para çok eksiye düşerse
                if (stats.para <= -1000) {
                    triggerGameOver('game_over_money');
                    return;
                }

                // Aile ilişkisi 0 ise Evden Atılma kontrolü (Sadece ailedeyse atılır)
                if (stats.aileIliski <= 0 && stats.barinma === 'aile') {
                    if (stats.yas < 18) triggerEventChange('kicked_out_young');
                    else triggerEventChange('kicked_out_adult');
                }

            }, [stats, isGameOver, gameState]);

            const addToast = (messages) => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, messages, leaving: false }]);
                setTimeout(() => {
                    setToasts(prev => prev.map(t => t.id === id ? { ...t, leaving: true } : t));
                    setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 300);
                }, 2500);
            };

            const triggerEventChange = (nextId) => {
                setAnimState('card-flip-out');
                setTimeout(() => {
                    setDisplayEventId(nextId);
                    setAnimState('card-flip-in');
                    requestAnimationFrame(() => requestAnimationFrame(() => setAnimState('card-idle')));
                }, 300);
            };

            const handlePointerDown = (e, index, isDisabled) => {
                if (isDisabled || animState !== 'card-idle') return;
                e.target.setPointerCapture(e.pointerId);
                setDragState({ isDragging: true, index: index, startX: e.clientX, startY: e.clientY, currentX: e.clientX, currentY: e.clientY });
            };

            const handlePointerMove = (e) => {
                if (!dragState.isDragging) return;
                setDragState(prev => ({ ...prev, currentX: e.clientX, currentY: e.clientY }));
                if (dropZoneRef.current) {
                    const rect = dropZoneRef.current.getBoundingClientRect();
                    const isInside = (e.clientX >= rect.left - 20 && e.clientX <= rect.right + 20 && e.clientY >= rect.top - 20 && e.clientY <= rect.bottom + 40);
                    setIsHoveringDropZone(isInside);
                }
            };

            const handlePointerUp = (e) => {
                if (!dragState.isDragging) return;
                e.target.releasePointerCapture(e.pointerId);
                if (isHoveringDropZone && dropZoneRef.current) {
                    const choice = EVENTS[displayEventId].choices[dragState.index];
                    handleChoice(choice);
                }
                setDragState({ isDragging: false, index: null, startX: 0, startY: 0, currentX: 0, currentY: 0 });
                setIsHoveringDropZone(false);
            };

            const startGameWithCity = (cityName, isFromUnlocked = false, customDifficulty = null) => {
                setCityProgress(prev => ({
                    ...prev,
                    [cityName]: prev[cityName] || { maxAge: 0, unlockedDiffs: ['kolay'] }
                }));

                let finalDiff = customDifficulty || 'kolay';
                
                // Statları Rastgele Belirle (20 ile 60 arası)
                const newStats = {
                    ...INITIAL_STATS,
                    zeka: 20 + Math.floor(Math.random() * 40),
                    karizma: 20 + Math.floor(Math.random() * 40),
                    guc: 20 + Math.floor(Math.random() * 40)
                };

                setSelectedCity(cityName);
                setDifficulty(finalDiff);
                setStats(newStats);
                setFamilyInfo(generateFamily());
                setIsGameOver(false);
                setToasts([]);
                setDisplayEventId('hub_baby');
                setGameState('playing');
                setActiveTab('game');

                // Eğer rastgele listeden seçildiyse havuzu güncelle
                if (!isFromUnlocked) {
                    setAvailablePool(prev => prev.filter(c => c !== cityName));
                    // Seçilen listeyi yenile
                    generateMenuCities();
                }
            };

            const handleChoice = (choice) => {
                if (choice.nextId === 'menu') {
                    setGameState('menu');
                    return;
                }

                let newStats = { ...stats };
                let diffs = { para: 0, mutluluk: 0, saglik: 0, aileIliski: 0, okul: 0, zeka: 0, karizma: 0, guc: 0 };
                let toastMessages = [];
                let isRandomEventTriggered = false;
                let targetId = choice.nextId;

                // Stat Etkilerini Hesapla
                const applyEffects = (effectObj) => {
                    if (effectObj.para) { newStats.para += effectObj.para; diffs.para += effectObj.para; }
                    if (effectObj.mutluluk) { newStats.mutluluk += effectObj.mutluluk; diffs.mutluluk += effectObj.mutluluk; }
                    if (effectObj.saglik) { newStats.saglik += effectObj.saglik; diffs.saglik += effectObj.saglik; }
                    if (effectObj.aileIliski) { newStats.aileIliski += effectObj.aileIliski; diffs.aileIliski += effectObj.aileIliski; }
                    if (effectObj.okul) { newStats.okul += effectObj.okul; diffs.okul += effectObj.okul; }
                    if (effectObj.tecrube) { newStats.tecrube += effectObj.tecrube; }
                    if (effectObj.barinma) { newStats.barinma = effectObj.barinma; }
                    
                    // Personal Stats
                    if (effectObj.zeka) { newStats.zeka += effectObj.zeka; diffs.zeka += effectObj.zeka; }
                    if (effectObj.karizma) { newStats.karizma += effectObj.karizma; diffs.karizma += effectObj.karizma; }
                    if (effectObj.guc) { newStats.guc += effectObj.guc; diffs.guc += effectObj.guc; }
                    if (effectObj.sevgili !== undefined) { newStats.sevgili = effectObj.sevgili; }
                    
                    if (effectObj.hareketsizlik !== undefined) {
                        if (effectObj.hareketsizlik === -99) newStats.hareketsizlik = 0;
                        else newStats.hareketsizlik += effectObj.hareketsizlik;
                    } else if (choice.step > 0) {
                        // Eğer effectObj hareketsizliği belirlemediyse ve step atlanıyorsa, otomatik artır
                        newStats.hareketsizlik += 1;
                    }
                };

                // Yaş & Adım Mekaniği
                if (choice.step > 0) {
                    newStats.secimSayaci += choice.step;
                    
                    // Zorluk Çarpanı
                    const diffMultiplier = difficulty === 'kolay' ? 1 : difficulty === 'orta' ? 0.7 : 0.4;
                    
                    // Harçlık
                    if (newStats.yas >= 7 && newStats.yas <= 18 && newStats.barinma === 'aile') {
                         const baseAllowance = 10 * newStats.yas; 
                         const actualAllowance = Math.floor(baseAllowance * familyInfo.wealthMultiplier * diffMultiplier);
                         newStats.para += actualAllowance;
                         diffs.para += actualAllowance;
                    }

                    // Dinamik Yaş Atlama Hızı
                    let stepsToAgeUp = 5;
                    if (newStats.yas <= 3) stepsToAgeUp = 2; // Bebeklik hızlı
                    else if (newStats.yas <= 18) stepsToAgeUp = 4; // Okul yılları normal

                    if (newStats.secimSayaci >= stepsToAgeUp) {
                        newStats.yas += 1;
                        newStats.secimSayaci = 0;
                    }

                    // Etkileşimli Rastgele Olay Tetikleme (%25 İhtimal)
                    if (targetId === 'hub' && Math.random() < 0.25) {
                        const availableRandoms = INTERACTIVE_RANDOM_EVENTS.filter(e => 
                            newStats.yas >= e.minAge && 
                            newStats.yas <= e.maxAge &&
                            (!e.condition || e.condition(newStats))
                        );
                        if(availableRandoms.length > 0) {
                            const rndEvent = availableRandoms[Math.floor(Math.random() * availableRandoms.length)];
                            targetId = rndEvent.id;
                            isRandomEventTriggered = true;
                        }
                    }
                }

                // Hub Rotasyon Matematiği
                if (!isRandomEventTriggered && targetId === 'hub') {
                    if (newStats.barinma === 'yurt') {
                        if (newStats.yas >= 18) targetId = 'orphanage_leave';
                        else targetId = 'hub_orphanage';
                    } else if (newStats.barinma === 'sokak') {
                        targetId = 'hub_street';
                    } else {
                        if (newStats.yas <= 3) targetId = 'hub_baby';
                        else if (newStats.yas <= 6) targetId = 'hub_child';
                        else if (newStats.yas <= 14) targetId = 'hub_school';
                        else if (newStats.yas <= 18) targetId = 'hub_teen';
                        else targetId = 'hub_adult';
                    }
                }

                let nextEvent = EVENTS[targetId];

                // Seçimin Kendisinden Gelen Etkiler
                if (choice.effect) {
                     let choiceEffect = typeof choice.effect === 'function' ? choice.effect(newStats).effect : choice.effect;
                     applyEffects(choiceEffect);
                     if (typeof choice.effect === 'function') {
                         const res = choice.effect(newStats);
                         if(res.msg) toastMessages.push({ icon: 'fa-info-circle', text: res.msg, color: 'text-sky-500' });
                     }
                }

                // Hedef kartın getirdiği etkiler
                if (nextEvent && nextEvent.effect && !isRandomEventTriggered) {
                    let effectToApply = nextEvent.effect;
                    if (typeof nextEvent.effect === 'function') {
                        const res = nextEvent.effect(newStats);
                        effectToApply = res.effect;
                        if(res.msg) toastMessages.push({ icon: 'fa-info-circle', text: res.msg, color: 'text-sky-500' });
                    }
                    applyEffects(effectToApply);
                }
                
                // Hareketsizlik Kontrolü
                if (newStats.hareketsizlik >= 2) {
                    newStats.guc -= 5;
                    diffs.guc -= 5;
                    newStats.hareketsizlik = 0;
                    toastMessages.push({ icon: 'fa-couch', text: "Hareketsizlikten güç kaybettin!", color: 'text-orange-500' });
                }

                if (stats.mutluluk <= 0 && diffs.mutluluk <= 0) {
                    newStats.saglik -= 10;
                    diffs.saglik -= 10;
                    toastMessages.push({ icon: 'fa-cloud-rain', text: "Ağır Depresyon", color: 'text-slate-500' });
                }

                // Sınırlandırmalar
                newStats.mutluluk = Math.max(0, Math.min(100, newStats.mutluluk));
                newStats.saglik = Math.max(0, Math.min(100, newStats.saglik));
                newStats.aileIliski = Math.max(0, Math.min(100, newStats.aileIliski));
                newStats.okul = Math.max(0, Math.min(100, newStats.okul));
                
                newStats.zeka = Math.max(0, Math.min(100, newStats.zeka));
                newStats.karizma = Math.max(0, Math.min(100, newStats.karizma));
                newStats.guc = Math.max(0, Math.min(100, newStats.guc));

                // Değişimleri Ekranda Göster
                if (diffs.para !== 0) toastMessages.push({ icon: 'fa-coins', val: diffs.para, color: diffs.para > 0 ? 'text-amber-500' : 'text-red-500' });
                if (diffs.mutluluk !== 0) toastMessages.push({ icon: 'fa-face-smile', val: diffs.mutluluk, color: diffs.mutluluk > 0 ? 'text-pink-500' : 'text-red-500' });
                if (diffs.saglik !== 0) toastMessages.push({ icon: 'fa-heart', val: diffs.saglik, color: diffs.saglik > 0 ? 'text-rose-500' : 'text-red-500' });
                if (diffs.aileIliski !== 0) toastMessages.push({ icon: 'fa-users', val: diffs.aileIliski, color: diffs.aileIliski > 0 ? 'text-violet-500' : 'text-red-500' });
                if (diffs.okul !== 0) toastMessages.push({ icon: 'fa-graduation-cap', val: diffs.okul, color: diffs.okul > 0 ? 'text-indigo-500' : 'text-red-500' });
                if (diffs.zeka > 0) toastMessages.push({ icon: 'fa-brain', val: diffs.zeka, color: 'text-blue-500' });
                if (diffs.karizma > 0) toastMessages.push({ icon: 'fa-star', val: diffs.karizma, color: 'text-yellow-500' });
                if (diffs.guc > 0) toastMessages.push({ icon: 'fa-dumbbell', val: diffs.guc, color: 'text-orange-500' });
                
                if (toastMessages.length > 0) addToast(toastMessages);

                setStats(newStats);
                
                // Anında Ölüm Kontrolü
                if (newStats.saglik <= 0) {
                    return; // useEffect handle edecek
                }

                if (!(newStats.para <= -1000 || newStats.saglik <= 0)) {
                    triggerEventChange(targetId);
                }
            };

            const StatHeader = ({ icon, value, type, suffix = "", colorClass }) => {
                const isDanger = (type === 'saglik' && value <= 30) || (type === 'mutluluk' && value === 0) || (type === 'para' && value <= -500) || (type === 'aile' && value <= 30);
                const displayColor = isDanger ? 'text-red-500 animate-pulse' : colorClass;
                return (
                    <div className="flex flex-col items-center relative bg-white/50 backdrop-blur-sm px-1.5 sm:px-2.5 py-1 rounded-2xl shadow-sm border border-white/60">
                        <i className={`fas ${icon} text-sm sm:text-base mb-0.5 ${displayColor}`}></i>
                        <span className={`text-[10px] sm:text-xs font-black ${displayColor}`}>{value}{suffix}</span>
                    </div>
                );
            };

            if (gameState === 'menu') {
                return (
                    <div className="app-container">
                        <div className="bg-pattern"></div>
                        <div className="flex-1 flex flex-col items-center justify-center p-6 z-10 w-full">
                            <i className="fas fa-map-location-dot text-6xl text-sky-500 mb-4 filter drop-shadow-md"></i>
                            <h1 className="text-3xl font-black text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600 mb-6">
                                Türkiye Yaşam Simülatörü
                            </h1>
                            
                            <div className="w-full bg-white/60 backdrop-blur-md rounded-2xl p-4 shadow-sm border border-white/80 mb-4">
                                <h3 className="text-xs font-black uppercase text-slate-600 mb-3">
                                    Yeni Oyuna Başla (Rastgele 3 Şehir)
                                </h3>
                                <div className="flex flex-col gap-2">
                                    {currentChoicesCities.map(city => (
                                        <button 
                                            key={city} 
                                            onClick={() => startGameWithCity(city)}
                                            className="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl shadow-md transition-transform active:scale-95"
                                        >
                                            {city} (Kolay)
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {Object.keys(cityProgress).length > 0 && (
                                <div className="w-full bg-white/60 backdrop-blur-md rounded-2xl p-4 shadow-sm border border-white/80 max-h-48 overflow-y-auto custom-scrollbar">
                                    <h3 className="text-xs font-black uppercase text-slate-600 mb-2">
                                        Kilidi Açılan Şehirler
                                    </h3>
                                    <p className="text-[9px] text-slate-500 mb-2">Bir sonraki zorluğu açmak için 40 yaşına ulaş.</p>
                                    <div className="flex flex-col gap-2">
                                        {Object.entries(cityProgress).map(([city, data], idx) => (
                                            <div key={idx} className="bg-white/50 p-2 rounded-xl flex flex-col gap-1 border border-white/50">
                                                <div className="flex justify-between items-center px-1">
                                                    <span className="font-bold text-xs"><i className="fas fa-unlock text-[10px] text-emerald-500 mr-1"></i> {city}</span>
                                                    <span className="text-[9px] text-slate-500 font-bold">Max Yaş: {data.maxAge}</span>
                                                </div>
                                                <div className="flex gap-1 justify-center">
                                                    {data.unlockedDiffs.map(diff => (
                                                        <button 
                                                            key={diff} 
                                                            onClick={() => startGameWithCity(city, true, diff)}
                                                            className={`py-1 px-3 text-[10px] font-bold rounded-lg shadow-sm active:scale-95 transition-all text-white
                                                                ${diff === 'kolay' ? 'bg-emerald-500' : diff === 'orta' ? 'bg-amber-500' : 'bg-rose-500'}`}
                                                        >
                                                            {diff.toUpperCase()}
                                                        </button>
                                                    ))}
                                                    {!data.unlockedDiffs.includes('orta') && <span className="py-1 px-3 text-[10px] bg-slate-200 text-slate-400 rounded-lg"><i className="fas fa-lock"></i> ORTA</span>}
                                                    {!data.unlockedDiffs.includes('zor') && <span className="py-1 px-3 text-[10px] bg-slate-200 text-slate-400 rounded-lg"><i className="fas fa-lock"></i> ZOR</span>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                        
                        <div className="absolute bottom-4 left-0 w-full text-center z-10 flex flex-col items-center">
                             <div className="text-[10px] text-slate-500 font-bold mb-2">Kalan İl Sayısı: {availablePool.length} / 81</div>
                             <button onClick={() => setIsDarkMode(!isDarkMode)} className="w-10 h-10 rounded-full bg-white/70 border border-white/60 shadow-sm flex items-center justify-center active:scale-90 transition-transform">
                                 <i className={`fas ${isDarkMode ? 'fa-sun text-amber-400' : 'fa-moon text-indigo-500'}`}></i>
                             </button>
                        </div>
                    </div>
                );
            }

            const currentEvent = EVENTS[displayEventId] || EVENTS['hub_baby'];

            return (
                <div className="app-container">
                    <div className="bg-pattern"></div>
                    
                    {/* Toasts */}
                    <div className="absolute top-28 left-0 w-full flex flex-col items-center gap-2 z-50 pointer-events-none px-4">
                        {toasts.map(toast => (
                            <div key={toast.id} className={`bg-white/90 backdrop-blur-md shadow-sm rounded-2xl px-5 py-2 border border-white flex gap-4 items-center justify-center flex-wrap transition-all max-w-[90vw] text-center ${toast.leaving ? 'toast-leave' : 'toast-enter'}`}>
                                {toast.messages.map((msg, i) => (
                                    <div key={i} className={`flex items-center gap-1.5 font-black text-xs sm:text-sm ${msg.color}`}>
                                        <i className={`fas ${msg.icon}`}></i>
                                        {msg.text ? <span>{msg.text}</span> : <span>{msg.val > 0 ? '+' : ''}{msg.val}</span>}
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>

                    {/* Header Stats */}
                    <div className="h-20 sm:h-24 bg-white/30 backdrop-blur-md border-b border-white/50 flex items-center justify-between px-1.5 sm:px-3 z-20 shadow-sm relative rounded-b-[1.5rem] gap-0.5 sm:gap-1.5">
                        <StatHeader icon="fa-coins" value={stats.para} type="para" suffix="₺" colorClass="text-amber-500" />
                        <StatHeader icon="fa-face-smile" value={stats.mutluluk} type="mutluluk" suffix="%" colorClass="text-pink-500" />
                        <StatHeader icon="fa-heart" value={stats.saglik} type="saglik" suffix="%" colorClass="text-rose-500" />
                        <StatHeader icon="fa-graduation-cap" value={stats.okul} type="okul" suffix="%" colorClass="text-indigo-500" />
                        <StatHeader icon="fa-users" value={stats.aileIliski} type="aile" suffix="%" colorClass="text-violet-500" />
                        
                        <div className="flex flex-col items-center justify-center bg-white/50 backdrop-blur-sm px-1.5 py-1 rounded-2xl shadow-sm border border-white/60 min-w-[45px] sm:min-w-[55px]">
                            <i className="fas fa-birthday-cake text-xs mb-0.5 text-sky-500"></i>
                            <span className="text-[10px] font-black text-sky-600 leading-tight text-center">{stats.yas} Y</span>
                        </div>
                    </div>

                    {/* Şehir ve Zorluk Bilgisi */}
                    <div className="absolute top-24 sm:top-28 w-full text-center z-10 pointer-events-none mt-1">
                        <span className="text-[10px] font-black uppercase text-slate-400 bg-white/50 px-3 py-1 rounded-full shadow-sm">
                            <i className="fas fa-map-marker-alt text-sky-500"></i> {selectedCity} | Zorluk: {difficulty}
                        </span>
                    </div>

                    {/* Main Event Card */}
                    <div className="flex-1 flex flex-col items-center justify-center p-4 z-10 card-perspective w-full h-full relative pb-[80px]">
                        <div ref={dropZoneRef} className={`main-card ${animState} ${isHoveringDropZone ? 'drop-hover' : ''} z-10`}>
                            <div className="text-6xl sm:text-7xl mb-4 filter drop-shadow-md transition-transform duration-300 hover:scale-110 cursor-default">
                                {currentEvent.emoji}
                            </div>
                            <h2 className="font-extrabold text-xl sm:text-2xl mb-3 text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 uppercase">
                                {currentEvent.title}
                            </h2>
                            <p className="text-[13px] sm:text-[14px] text-slate-600 leading-relaxed font-semibold">
                                {currentEvent.description}
                            </p>
                            
                            {dragState.isDragging && !isHoveringDropZone && (
                                <div className="absolute inset-0 border-4 border-dashed border-sky-300 rounded-3xl opacity-50 animate-pulse pointer-events-none"></div>
                            )}
                        </div>
                    </div>

                    {/* Choice Fan */}
                    <div className="absolute bottom-[60px] left-0 w-full z-20 flex justify-center pointer-events-none">
                        <div className="fan-container pointer-events-auto">
                            {currentEvent.choices.map((choice, index) => {
                                let isDisabled = false;
                                let reqText = "";
                                if (choice.req) {
                                    for (const [key, value] of Object.entries(choice.req)) {
                                        if (stats[key] < value) { isDisabled = true; reqText = `(${value}${key==='para'?'₺':''})`; }
                                    }
                                }

                                const total = currentEvent.choices.length;
                                const middle = (total - 1) / 2;
                                const offset = index - middle;
                                const isThisCardDragging = dragState.isDragging && dragState.index === index;
                                const rotation = offset * 14;
                                const translateY = Math.abs(offset) * 10;
                                const zIndexBase = 10 + index;
                                const dragX = isThisCardDragging ? dragState.currentX - dragState.startX : 0;
                                const dragY = isThisCardDragging ? dragState.currentY - dragState.startY : 0;
                                const marginLeft = index === 0 ? '0' : '-30px';

                                return (
                                    <button 
                                        key={index}
                                        disabled={isDisabled}
                                        onPointerDown={(e) => handlePointerDown(e, index, isDisabled)}
                                        onPointerMove={handlePointerMove}
                                        onPointerUp={handlePointerUp}
                                        className={`choice-draggable-card ${isThisCardDragging ? 'dragging' : ''}`}
                                        style={{
                                            transform: isThisCardDragging 
                                                ? `translate(${dragX}px, ${dragY}px) scale(1.1) rotate(0deg)` 
                                                : `rotate(${rotation}deg) translateY(${translateY}px) scale(1)`,
                                            zIndex: isThisCardDragging ? 100 : zIndexBase,
                                            marginLeft: marginLeft,
                                            transition: isThisCardDragging ? 'none' : 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)'
                                        }}
                                    >
                                        <div className="pointer-events-none flex flex-col items-center w-full h-full justify-between">
                                            <span className="text-2xl mt-1">{choice.icon}</span>
                                            <span className="font-bold text-[11px] sm:text-[12px] leading-snug mt-2 text-slate-700">
                                                {choice.text}
                                            </span>
                                            <div className="h-4 mt-1">
                                                {isDisabled ? (
                                                    <span className="text-[9px] font-black text-rose-500 bg-rose-100 px-1.5 py-0.5 rounded-full">{reqText}</span>
                                                ) : (
                                                    <span className={`text-[9px] font-bold text-gray-400 ${animState === 'card-idle' && !dragState.isDragging ? 'animate-pulse' : ''}`}>
                                                        SÜRÜKLE
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Alt Navigasyon Barı */}
                    <div className="bottom-nav">
                        <button onClick={() => setActiveTab('game')} className={`nav-btn ${activeTab === 'game' ? 'active' : ''}`}>
                            <i className="fas fa-gamepad"></i>
                            Oyun
                        </button>
                        <button onClick={() => setActiveTab('stats')} className={`nav-btn ${activeTab === 'stats' ? 'active' : ''}`}>
                            <i className="fas fa-user-astronaut"></i>
                            Karakter
                        </button>
                    </div>

                    {/* Stat Overlay (Sadece aktifken görünür) */}
                    {activeTab === 'stats' && (
                        <div className="stats-overlay">
                            <h2 className="text-2xl font-black mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r from-blue-500 to-purple-500">
                                Kişisel Özellikler
                            </h2>
                            
                            <div className="flex flex-col gap-6">
                                {/* Zeka */}
                                <div className="bg-white/50 backdrop-blur-sm p-4 rounded-2xl border border-white/60 shadow-sm">
                                    <div className="flex justify-between items-center mb-1">
                                        <div className="font-bold text-blue-600 flex items-center gap-2"><i className="fas fa-brain"></i> Zeka</div>
                                        <div className="font-black text-sm">{stats.zeka}/100</div>
                                    </div>
                                    <p className="text-[10px] text-slate-500 font-semibold mb-2 leading-tight">Kompleks işleri çözme becerisi, maaşa ve eğitim başarılarına büyük katkı sağlar.</p>
                                    <div className="stat-bar-bg">
                                        <div className="stat-bar-fill bg-blue-500" style={{ width: `${stats.zeka}%` }}></div>
                                    </div>
                                </div>

                                {/* Karizma */}
                                <div className="bg-white/50 backdrop-blur-sm p-4 rounded-2xl border border-white/60 shadow-sm">
                                    <div className="flex justify-between items-center mb-1">
                                        <div className="font-bold text-yellow-500 flex items-center gap-2"><i className="fas fa-star"></i> Karizma</div>
                                        <div className="font-black text-sm">{stats.karizma}/100</div>
                                    </div>
                                    <p className="text-[10px] text-slate-500 font-semibold mb-2 leading-tight">İnsanlarla olan ilişkini etkiler, aşkı bulma şansını artırır ve belalardan lafla sıyrılmanı sağlar.</p>
                                    <div className="stat-bar-bg">
                                        <div className="stat-bar-fill bg-yellow-400" style={{ width: `${stats.karizma}%` }}></div>
                                    </div>
                                </div>

                                {/* Güç */}
                                <div className="bg-white/50 backdrop-blur-sm p-4 rounded-2xl border border-white/60 shadow-sm">
                                    <div className="flex justify-between items-center mb-1">
                                        <div className="font-bold text-orange-500 flex items-center gap-2"><i className="fas fa-dumbbell"></i> Güç</div>
                                        <div className="font-black text-sm">{stats.guc}/100</div>
                                    </div>
                                    <p className="text-[10px] text-slate-500 font-semibold mb-2 leading-tight">Fiziksel olaylarda dayanıklılığı sağlar. Hareketsizlik ve kötü beslenme gücü düşürür.</p>
                                    <div className="stat-bar-bg">
                                        <div className="stat-bar-fill bg-orange-500" style={{ width: `${stats.guc}%` }}></div>
                                    </div>
                                </div>
                                
                                {/* Ekstra Durumlar */}
                                <div className="mt-2 text-center text-xs font-bold text-slate-600">
                                    İlişki Durumu: <span className={stats.sevgili ? 'text-pink-500' : 'text-slate-400'}>{stats.sevgili ? '❤️ Sevgilisi Var' : '💔 Yalnız'}</span>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
