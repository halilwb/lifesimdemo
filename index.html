<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Türkiye Yaşam Simülatörü - Neşeli Sürüm</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Eğlenceli ve modern font: Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            /* Aydınlık, keyifli ve canlı arka plan gradiyenti */
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #334155; /* Yumuşak koyu gri metin */
        }

        /* Özel Kaydırma Çubuğu */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255,255,255,0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ff758c; border-radius: 10px; }

        /* Mobil Uygulama Çerçevesi */
        .app-container {
            width: 100%;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        @media (min-width: 640px) {
            .app-container {
                width: 400px;
                height: 850px;
                max-height: 95vh;
                border-radius: 2.5rem;
                border: 8px solid #ffffff;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0,0,0,0.05);
            }
        }

        /* Eğlenceli Arka Plan Desenleri (Uçuşan şekiller) */
        .bg-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.4;
            background-image: radial-gradient(#ff758c 1.5px, transparent 1.5px), radial-gradient(#ff758c 1.5px, transparent 1.5px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            pointer-events: none;
            z-index: 0;
        }

        /* --- BEYAZ, AYDINLIK KART TASARIMI --- */
        .card-perspective {
            perspective: 1000px;
        }

        .main-card {
            width: 100%;
            max-width: 260px;
            aspect-ratio: 2 / 2.8;
            background: #ffffff;
            border-radius: 24px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08), inset 0 0 0 2px rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s, border-color 0.3s;
            transform-style: preserve-3d;
            margin: auto;
            border: 4px dashed transparent;
        }

        /* Sürükle-Bırak Hedef Alanı Parlaması */
        .main-card.drop-hover {
            transform: scale(1.05);
            border-color: #4ade80; /* Açık yeşil border */
            box-shadow: 0 25px 50px rgba(74, 222, 128, 0.3), 0 0 30px rgba(74, 222, 128, 0.2);
            background: #f0fdf4; /* Hafif yeşil arka plan */
        }

        /* Kart Animasyon Sınıfları */
        .card-idle { transform: scale(1) rotateY(0deg); opacity: 1; }
        .card-flip-out { transform: scale(0.9) rotateY(-90deg) translateY(-20px); opacity: 0; }
        .card-flip-in { transform: scale(0.9) rotateY(90deg) translateY(20px); opacity: 0; }

        /* Seçenek Kartları (Yelpaze Formatı) */
        .fan-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            height: 200px;
            position: relative;
            padding-bottom: 2rem;
        }

        .choice-draggable-card {
            width: 95px;
            aspect-ratio: 2 / 2.8;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.06);
            color: #475569;
            cursor: grab;
            transform-origin: bottom center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            /* Mobilde sürüklerken sayfanın kaymasını engellemek için önemli */
            touch-action: none; 
        }
        
        .choice-draggable-card:active {
            cursor: grabbing;
        }

        /* Sürüklenirken kartın görünümü */
        .choice-draggable-card.dragging {
            box-shadow: 0 30px 60px rgba(0,0,0,0.15), 0 0 0 2px #ff758c;
            opacity: 0.95;
            background: #fff0f2;
        }

        .choice-draggable-card:disabled {
            opacity: 0.5;
            filter: grayscale(100%);
            border-color: #cbd5e1;
            cursor: not-allowed;
            touch-action: auto;
        }

        /* Uçan Değerler */
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(10px) scale(0.8); }
            20% { opacity: 1; transform: translateY(0) scale(1.2); }
            100% { opacity: 0; transform: translateY(-40px) scale(1); }
        }
        .stat-float {
            position: absolute;
            top: 30px;
            font-weight: 900;
            animation: floatUp 1s ease-out forwards;
            pointer-events: none;
            z-index: 50;
            text-shadow: 0 2px 4px rgba(255,255,255,0.8);
        }

        .modal-enter { animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const INITIAL_STATS = { para: 500, mutluluk: 50, saglik: 80, tecrube: 0, gun: 1 };

        const RANDOM_EVENTS = [
            { text: "Yolda yürürken 50 TL buldun!", effect: { para: 50, mutluluk: 5 } },
            { text: "Otobüse binerken akbilin boş çıktı, rezil oldun.", effect: { mutluluk: -10 } },
            { text: "Mahalle bakkalı veresiye defterini kapattı.", effect: { mutluluk: -5 } },
            { text: "Ucuz tavuk döner zehirledi.", effect: { saglik: -15, mutluluk: -5, para: -30 } },
            { text: "Teyzen bayram harçlığı gönderdi.", effect: { para: 200, mutluluk: 15 } },
            { text: "Elektrik faturası zamlı geldi.", effect: { para: -150, mutluluk: -10 } },
            { text: "Sokak kedisi sevip stres attın.", effect: { mutluluk: 20 } },
            { text: "Grip oldun, ıhlamur parası gitti.", effect: { saglik: -10, para: -40 } }
        ];

        const EVENTS = {
            start: {
                id: 'start', emoji: '🌅', title: "Yeni Bir Gün",
                description: "Güneş parlıyor! Cebinde biraz paran, kalbinde umut var. Bugün ne yapmak istersin?",
                choices: [
                    { text: "İş Ara", nextId: 'job_hunt', time: 1, icon: '💼' },
                    { text: "Dışarı Çıkıp Gez", nextId: 'hangout', time: 1, icon: '🏃' },
                    { text: "Evde Dinlen", nextId: 'stay_home', time: 1, icon: '🛋️' }
                ]
            },
            job_hunt: {
                id: 'job_hunt', emoji: '🏢', title: "Kariyer Hedefleri",
                description: "İş aramak için dışarı çıktın. Birkaç yer geri dönüş yaptı, hangisini seçeceksin?",
                effect: { mutluluk: -5, tecrube: 5 },
                choices: [
                    { text: "Kasiyer (Düşük)", nextId: 'work_cashier', time: 1, icon: '🛒' },
                    { text: "Garson (Bahşişli)", nextId: 'work_waiter', time: 1, icon: '🍽️' },
                    { text: "Freelance", nextId: 'freelance_try', time: 1, icon: '💻' }
                ]
            },
            work_cashier: {
                id: 'work_cashier', emoji: '🛍️', title: "Kasa Nöbeti",
                description: "Bütün gün 'Bozuk var mı?' diye sordun. Ayaklarına kara sular indi ama para kazandın.",
                effect: { para: 200, mutluluk: -15, saglik: -5, tecrube: 2 },
                choices: [{ text: "Günü bitir", nextId: 'start', time: 1, icon: '🌙' }]
            },
            work_waiter: {
                id: 'work_waiter', emoji: '🍕', title: "Tepsi Sanatı",
                description: "Müşteriler biraz yordu ama bahşişler fena değildi. Gün sonu tatlı bir yorgunluk.",
                effect: { para: 250, mutluluk: -5, saglik: -10, tecrube: 3 },
                choices: [{ text: "Günü bitir", nextId: 'start', time: 1, icon: '🌙' }]
            },
            freelance_try: {
                id: 'freelance_try', emoji: '🚀', title: "Girişimci Ruhu",
                description: "İnternetten müşteri bulmaya çalıştın...",
                effect: (stats) => {
                    if (Math.random() > 0.6) return { effect: { para: 400, mutluluk: 20, tecrube: 10 }, msg: "Harika! Yeni bir müşteri buldun ve iyi para kazandın." };
                    return { effect: { mutluluk: -10, saglik: -5 }, msg: "Bugün şansın yaver gitmedi, müşteri bulamadın." };
                },
                choices: [{ text: "Tamam", nextId: 'start', time: 1, icon: '👍' }]
            },
            hangout: {
                id: 'hangout', emoji: '🎈', title: "Sokakların Sesi",
                description: "Dışarısı çok güzel! Nereye gidip biraz hava almak istersin?",
                choices: [
                    { text: "Lüks Kahve (100₺)", nextId: 'cafe', req: { para: 100 }, time: 1, icon: '☕' },
                    { text: "Sahil (30₺)", nextId: 'beach', req: { para: 30 }, time: 1, icon: '🌊' },
                    { text: "Parkta Yürü", nextId: 'walk', time: 1, icon: '🌳' }
                ]
            },
            cafe: {
                id: 'cafe', emoji: '🍰', title: "Keyif Molası",
                description: "Harika bir kahve içip tatlı yedin. Moralin tavan yaptı ama cüzdanın biraz hafifledi.",
                effect: { para: -100, mutluluk: 25, saglik: -2 },
                choices: [{ text: "Eve dön", nextId: 'start', time: 1, icon: '🏠' }]
            },
            beach: {
                id: 'beach', emoji: '🏖️', title: "Deniz Havası",
                description: "Sahilde martılara simit atıp, rüzgarı hissettin. Çok iyi geldi.",
                effect: { para: -30, mutluluk: 15, saglik: 5 },
                choices: [{ text: "Eve dön", nextId: 'start', time: 1, icon: '🏠' }]
            },
            walk: {
                id: 'walk', emoji: '👟', title: "Doğa Yürüyüşü",
                description: "Parkta uzun bir yürüyüş yaptın. Kuş sesleri eşliğinde kafanı dinledin.",
                effect: { mutluluk: 5, saglik: 10 },
                choices: [{ text: "Eve dön", nextId: 'start', time: 1, icon: '🏠' }]
            },
            stay_home: {
                id: 'stay_home', emoji: '🏡', title: "Ev Kuşu",
                description: "Bugün pijamalarla takılma günü. Ne yapalım?",
                effect: { mutluluk: 5, saglik: -5 },
                choices: [
                    { text: "Mışıl mışıl uyu", nextId: 'start', time: 1, icon: '😴' },
                    { text: "Oyun oyna", nextId: 'play_games', time: 1, icon: '🎮' }
                ]
            },
            play_games: {
                id: 'play_games', emoji: '🕹️', title: "Rekabetçi Maç",
                description: "Saatlerce oyun oynadın. Gözlerin yoruldu ama eğlenceliydi.",
                effect: { mutluluk: -5, saglik: -10 },
                choices: [{ text: "Bilgisayarı Kapat", nextId: 'start', time: 1, icon: '🔌' }]
            },
            game_over_money: {
                id: 'game_over_money', emoji: '💸', title: "İFLAS",
                description: "Kasan sıfırlandı... Maalesef maddi olarak tutunamadın.",
                isGameOver: true, choices: [{ text: "Yeniden Başla", nextId: 'reset', icon: '🔄' }]
            },
            game_over_health: {
                id: 'game_over_health', emoji: '🚑', title: "ŞİFA TALEBİ",
                description: "Sağlığına hiç dikkat etmedin ve hastalandın. Dinlenmen gerek.",
                isGameOver: true, choices: [{ text: "Yeniden Başla", nextId: 'reset', icon: '🔄' }]
            },
            game_over_sadness: {
                id: 'game_over_sadness', emoji: '🌧️', title: "TÜKENMİŞLİK",
                description: "Moralin tamamen sıfırlandı. Yeni bir başlangıca ihtiyacın var.",
                isGameOver: true, choices: [{ text: "Yeniden Başla", nextId: 'reset', icon: '🔄' }]
            }
        };

        const StatHeader = ({ icon, value, type, suffix = "", colorClass }) => {
            const prevValue = useRef(value);
            const [diff, setDiff] = useState(null);

            useEffect(() => {
                if (value !== prevValue.current && type !== 'gun') {
                    const d = value - prevValue.current;
                    setDiff({ id: Date.now(), val: d });
                    setTimeout(() => setDiff(null), 1000);
                    prevValue.current = value;
                }
            }, [value]);

            // Kırmızı uyarı rengi
            const isDanger = (type !== 'gun' && type !== 'para' && value < 30) || (type === 'para' && value < 50);
            const displayColor = isDanger ? 'text-red-500' : colorClass;

            return (
                <div className="flex flex-col items-center relative bg-white/50 backdrop-blur-sm px-3 py-1.5 rounded-2xl shadow-sm border border-white/60">
                    {diff && (
                        <span key={diff.id} className={`stat-float text-sm ${diff.val > 0 ? 'text-emerald-500' : 'text-rose-500'}`}>
                            {diff.val > 0 ? '+' : ''}{diff.val}
                        </span>
                    )}
                    <i className={`fas ${icon} text-lg mb-1 ${displayColor}`}></i>
                    <span className={`text-sm font-black ${displayColor}`}>{value}{suffix}</span>
                </div>
            );
        };

        const App = () => {
            const [stats, setStats] = useState(INITIAL_STATS);
            const [currentEventId, setCurrentEventId] = useState('start');
            const [logs, setLogs] = useState([{ day: 1, text: "Güneşli bir simülasyona hoş geldin!" }]);
            const [isGameOver, setIsGameOver] = useState(false);
            const [isLogOpen, setIsLogOpen] = useState(false);
            
            // Sahne Geçiş Animasyonları
            const [animState, setAnimState] = useState('card-idle');
            const [displayEventId, setDisplayEventId] = useState('start');

            // --- SÜRÜKLE BIRAK (DRAG & DROP) STATE'LERİ ---
            const [dragState, setDragState] = useState({
                isDragging: false,
                index: null, // Hangi kart sürükleniyor
                startX: 0,
                startY: 0,
                currentX: 0,
                currentY: 0,
            });
            const [isHoveringDropZone, setIsHoveringDropZone] = useState(false);
            
            const dropZoneRef = useRef(null);
            const logsEndRef = useRef(null);

            useEffect(() => {
                if (isLogOpen && logsEndRef.current) {
                    logsEndRef.current.scrollIntoView({ behavior: "smooth" });
                }
            }, [logs, isLogOpen]);

            // Oyun Sonu Kontrolü
            useEffect(() => {
                if (isGameOver) return;
                if (stats.para < 0) triggerEventChange('game_over_money');
                else if (stats.saglik <= 0) triggerEventChange('game_over_health');
                else if (stats.mutluluk <= 0) triggerEventChange('game_over_sadness');
            }, [stats, isGameOver]);

            const addLog = (text) => setLogs(prev => [...prev, { day: stats.gun, text }]);

            // Sahne Değişimi Animasyonu
            const triggerEventChange = (nextId) => {
                setAnimState('card-flip-out');
                setTimeout(() => {
                    setDisplayEventId(nextId);
                    setAnimState('card-flip-in');
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => setAnimState('card-idle'));
                    });
                }, 300);
            };

            const handlePointerDown = (e, index, isDisabled) => {
                if (isDisabled || animState !== 'card-idle') return;
                
                // Fare/Dokunma imlecini kilitle (Sürüklerken kartı kaybetmemek için)
                e.target.setPointerCapture(e.pointerId);
                
                setDragState({
                    isDragging: true,
                    index: index,
                    startX: e.clientX,
                    startY: e.clientY,
                    currentX: e.clientX,
                    currentY: e.clientY,
                });
            };

            const handlePointerMove = (e) => {
                if (!dragState.isDragging) return;
                
                setDragState(prev => ({ ...prev, currentX: e.clientX, currentY: e.clientY }));

                // Ana kartın (Hedef bölgenin) üzerinde miyiz? (Collision Detection)
                if (dropZoneRef.current) {
                    const rect = dropZoneRef.current.getBoundingClientRect();
                    // Hitbox'u biraz genişletelim (Kullanıcı kolay bıraksın diye tolerans payı)
                    const isInside = (
                        e.clientX >= rect.left - 20 &&
                        e.clientX <= rect.right + 20 &&
                        e.clientY >= rect.top - 20 &&
                        e.clientY <= rect.bottom + 40 
                    );
                    setIsHoveringDropZone(isInside);
                }
            };

            const handlePointerUp = (e) => {
                if (!dragState.isDragging) return;
                e.target.releasePointerCapture(e.pointerId);

                // Eğer kart hedef alana bırakıldıysa seçimi yap!
                if (isHoveringDropZone && dropZoneRef.current) {
                    const choice = EVENTS[displayEventId].choices[dragState.index];
                    handleChoice(choice);
                }

                // Sürükleme state'ini sıfırla (Kart yerine döner)
                setDragState({ isDragging: false, index: null, startX: 0, startY: 0, currentX: 0, currentY: 0 });
                setIsHoveringDropZone(false);
            };

            const handleChoice = (choice) => {
                if (choice.nextId === 'reset') {
                    setStats(INITIAL_STATS);
                    setLogs([{ day: 1, text: "Yepyeni umutlarla tekrar başladın." }]);
                    setIsGameOver(false);
                    triggerEventChange('start');
                    return;
                }

                let newStats = { ...stats };
                let nextEvent = EVENTS[choice.nextId];

                // Gün Sonu / Yeni Gün
                if (choice.time > 0 && choice.nextId === 'start') {
                    newStats.gun += choice.time;
                    const dailyExpense = 20 + Math.floor(newStats.tecrube / 2);
                    newStats.para -= dailyExpense;
                    addLog(`Gün ${newStats.gun}: Günlük masraflar ${dailyExpense}₺`);

                    if (Math.random() < 0.3) {
                        const rnd = RANDOM_EVENTS[Math.floor(Math.random() * RANDOM_EVENTS.length)];
                        addLog(`Sürpriz: ${rnd.text}`);
                        if (rnd.effect.para) newStats.para += rnd.effect.para;
                        if (rnd.effect.mutluluk) newStats.mutluluk += rnd.effect.mutluluk;
                        if (rnd.effect.saglik) newStats.saglik += rnd.effect.saglik;
                    }
                }

                if (nextEvent.effect) {
                    let effectToApply = nextEvent.effect;
                    if (typeof nextEvent.effect === 'function') {
                        const res = nextEvent.effect(newStats);
                        effectToApply = res.effect;
                        if (res.msg) addLog(res.msg);
                    }
                    if (effectToApply.para) newStats.para += effectToApply.para;
                    if (effectToApply.mutluluk) newStats.mutluluk += effectToApply.mutluluk;
                    if (effectToApply.saglik) newStats.saglik += effectToApply.saglik;
                    if (effectToApply.tecrube) newStats.tecrube += effectToApply.tecrube;
                }

                newStats.mutluluk = Math.max(0, Math.min(100, newStats.mutluluk));
                newStats.saglik = Math.max(0, Math.min(100, newStats.saglik));

                setStats(newStats);
                setCurrentEventId(choice.nextId);
                
                if (!(newStats.para < 0 || newStats.saglik <= 0 || newStats.mutluluk <= 0)) {
                    triggerEventChange(choice.nextId);
                } else {
                    setIsGameOver(true);
                }
            };

            const currentEvent = EVENTS[displayEventId];

            return (
                <div className="app-container">
                    <div className="bg-pattern"></div>
                    
                    {/* Üst Bar: İstatistikler */}
                    <div className="h-24 bg-white/30 backdrop-blur-md border-b border-white/50 flex items-center justify-between px-4 z-20 shadow-sm relative rounded-b-[2rem]">
                        <StatHeader icon="fa-coins" value={stats.para} type="para" suffix=" ₺" colorClass="text-amber-500" />
                        <StatHeader icon="fa-face-smile" value={stats.mutluluk} type="mutluluk" suffix="%" colorClass="text-pink-500" />
                        <StatHeader icon="fa-heart" value={stats.saglik} type="saglik" suffix="%" colorClass="text-rose-500" />
                        
                        <div className="w-[1px] h-10 bg-gray-300 mx-1"></div>
                        
                        <div className="flex flex-col items-center bg-white/50 backdrop-blur-sm px-3 py-1.5 rounded-2xl shadow-sm border border-white/60">
                            <i className="fas fa-calendar-day text-lg mb-1 text-sky-500"></i>
                            <span className="text-sm font-black text-sky-600">{stats.gun}. Gün</span>
                        </div>
                        
                        <button onClick={() => setIsLogOpen(true)} className="ml-1 w-11 h-11 rounded-full bg-white/70 border border-white shadow-sm flex items-center justify-center active:scale-90 transition-transform">
                            <i className="fas fa-book-open text-indigo-500 text-lg"></i>
                        </button>
                    </div>

                    {/* Ana Sahne Kartı & Sürükle Bırak Hedef Alanı */}
                    <div className="flex-1 flex flex-col items-center justify-center p-4 z-10 card-perspective w-full h-full relative">
                        
                        {/* Arkadaki İpucu Metni (Kart sürüklenirken belirginleşir) */}
                        <div className={`absolute inset-0 flex items-center justify-center pointer-events-none transition-opacity duration-300 z-0 ${dragState.isDragging ? 'opacity-100' : 'opacity-0'}`}>
                            <span className="text-2xl font-black text-emerald-400 drop-shadow-md bg-white/80 px-6 py-2 rounded-full -translate-y-32">
                                <i className="fas fa-arrow-down mr-2 animate-bounce"></i> BURAYA BIRAK
                            </span>
                        </div>

                        <div 
                            ref={dropZoneRef}
                            className={`main-card ${animState} ${isHoveringDropZone ? 'drop-hover' : ''} z-10`}
                        >
                            <div className="text-7xl mb-4 filter drop-shadow-md transition-transform duration-300 hover:scale-110 cursor-default">
                                {currentEvent.emoji}
                            </div>
                            <h2 className="font-extrabold text-2xl mb-3 text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 uppercase">
                                {currentEvent.title}
                            </h2>
                            <p className="text-[15px] text-slate-600 leading-relaxed font-semibold">
                                {currentEvent.description}
                            </p>
                            
                            {/* Hedef alanı göstergesi (Sadece sürüklerken çıkar) */}
                            {dragState.isDragging && !isHoveringDropZone && (
                                <div className="absolute inset-0 border-4 border-dashed border-sky-300 rounded-3xl opacity-50 animate-pulse pointer-events-none"></div>
                            )}
                        </div>
                    </div>

                    {}
                    <div className="w-full z-20 pt-6 pb-6 flex justify-center">
                        <div className="fan-container">
                            {currentEvent.choices.map((choice, index) => {
                                let isDisabled = false;
                                let reqText = "";
                                if (choice.req) {
                                    for (const [key, value] of Object.entries(choice.req)) {
                                        if (stats[key] < value) { isDisabled = true; reqText = `(${value}${key==='para'?'₺':''})`; }
                                    }
                                }

                                const total = currentEvent.choices.length;
                                const middle = (total - 1) / 2;
                                const offset = index - middle;
                                
                                const isThisCardDragging = dragState.isDragging && dragState.index === index;
                                
                                // Yelpaze pozisyonu hesaplama
                                const rotation = offset * 12;
                                const translateY = Math.abs(offset) * 12;
                                const zIndexBase = 10 + index;
                                
                                // Sürüklerken farenin ne kadar hareket ettiği
                                const dragX = isThisCardDragging ? dragState.currentX - dragState.startX : 0;
                                const dragY = isThisCardDragging ? dragState.currentY - dragState.startY : 0;

                                // Negatif margin ile üst üste bindirme
                                const marginLeft = index === 0 ? '0' : '-35px';

                                return (
                                    <button 
                                        key={index}
                                        disabled={isDisabled}
                                        onPointerDown={(e) => handlePointerDown(e, index, isDisabled)}
                                        onPointerMove={handlePointerMove}
                                        onPointerUp={handlePointerUp}
                                        className={`choice-draggable-card ${isThisCardDragging ? 'dragging' : ''}`}
                                        style={{
                                            transform: isThisCardDragging 
                                                ? `translate(${dragX}px, ${dragY}px) scale(1.1) rotate(0deg)` 
                                                : `rotate(${rotation}deg) translateY(${translateY}px) scale(1)`,
                                            zIndex: isThisCardDragging ? 100 : zIndexBase,
                                            marginLeft: marginLeft,
                                            transition: isThisCardDragging ? 'none' : 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)'
                                        }}
                                    >
                                        <div className="pointer-events-none flex flex-col items-center w-full h-full justify-between">
                                            <span className="text-3xl mt-1">{choice.icon}</span>
                                            <span className="font-bold text-[13px] leading-snug mt-2 text-slate-700">
                                                {choice.text}
                                            </span>
                                            <div className="h-4 mt-1">
                                                {isDisabled ? (
                                                    <span className="text-[10px] font-black text-rose-500 bg-rose-100 px-2 py-0.5 rounded-full">{reqText}</span>
                                                ) : (
                                                    <span className={`text-[10px] font-bold text-gray-400 ${animState === 'card-idle' && !dragState.isDragging ? 'animate-pulse' : ''}`}>
                                                        SÜRÜKLE
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    {/* Günlük (Log) Modalı */}
                    {isLogOpen && (
                        <div className="absolute inset-0 bg-white/40 backdrop-blur-xl z-50 flex flex-col modal-enter">
                            <div className="flex items-center justify-between p-5 border-b border-gray-200 bg-white/90 shadow-sm rounded-b-3xl relative z-10">
                                <h3 className="font-extrabold text-indigo-500 text-xl"><i className="fas fa-book-open mr-2 text-pink-400"></i>Yaşam Günlüğü</h3>
                                <button onClick={() => setIsLogOpen(false)} className="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 text-gray-500 hover:bg-rose-100 hover:text-rose-500 transition-colors active:scale-95">
                                    <i className="fas fa-times text-xl"></i>
                                </button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 custom-scrollbar bg-transparent pb-20">
                                {logs.map((log, i) => (
                                    <div key={i} className="mb-3 p-4 rounded-2xl bg-white shadow-sm border border-gray-100 text-sm flex gap-3 transform transition-transform hover:scale-[1.02]">
                                        <span className="text-pink-500 font-black shrink-0 bg-pink-50 px-2 py-1 rounded-lg h-fit">Gün {log.day}</span>
                                        <span className="text-slate-600 font-medium font-semibold leading-relaxed pt-1">{log.text}</span>
                                    </div>
                                ))}
                                <div ref={logsEndRef} />
                            </div>
                        </div>
                    )}
                    
                </div>
            );
        };

        // Uygulamayı Başlat
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
