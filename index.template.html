<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌌 Türkiye Yaşam Simülatörü</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Modern display font stack -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ===== MODERN UI (Midnight Aurora) — bu blok hemşe index.html'e hemşe build.js'de kopyır. ===== -->
    <style>
        /* ---- Accent palette (shared) ---- */
        :root {
            --acc-1: #6366f1;   /* indigo  */
            --acc-2: #8b5cf6;   /* violet  */
            --acc-3: #d946ef;   /* fuchsia */
            --acc-4: #22d3ee;   /* cyan    */
        }

        /* 1. ANA ARKA PLAN & BODY */
        body {
            font-family: 'Space Grotesk', 'Nunito', 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh;
            color: #1e293b;
            overflow: hidden;
            /* Light: "pearl mist" premium glass ground */
            background: #eef2f9;
            background-image:
                radial-gradient(circle at 15% -10%, rgba(99,102,241,.16), transparent 48%),
                radial-gradient(circle at 85% 115%, rgba(34,211,238,.14), transparent 48%),
                radial-gradient(circle at 50% 55%, rgba(168,85,247,.10), transparent 60%);
        }

        /* ---- DARK MODE: Midnight Aurora ---- */
        body.dark-theme {
            background: #060a14;
            background-image:
                radial-gradient(circle at 18% -12%, rgba(99,102,241,.38), transparent 50%),
                radial-gradient(circle at 82% 112%, rgba(34,211,238,.30), transparent 50%),
                radial-gradient(circle at 48% 42%, rgba(217,70,239,.20), transparent 55%),
                radial-gradient(circle at 70% 20%, rgba(139,92,246,.22), transparent 45%);
            color: #e2e8f0;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(127,127,127,.08); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(138,132,248,.4); border-radius: 10px; }

        /* 2. ANA UYGULAMA KONTEYNERİ */
        .app-container {
            width: 100%;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(234,240,250,.35) 100%);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border: 1px solid rgba(255,255,255,.55);
        }
        body.dark-theme .app-container {
            background: linear-gradient(180deg, rgba(9,14,26,.5) 0%, rgba(11,18,34,.55) 100%);
            border-color: rgba(99,102,241,.35);
            box-shadow: 0 0 120px rgba(99,102,241,.18), inset 0 0 1px rgba(148,163,184,.15);
        }

        @media (min-width: 640px) {
            .app-container {
                width: 420px;
                height: 850px;
                max-height: 95vh;
                border-radius: 2.5rem;
                border: 1px solid rgba(255,255,255,.6);
                box-shadow:
                    0 25px 60px -12px rgba(59,66,200,.35),
                    0 0 0 1px rgba(0,0,0,.04),
                    inset 0 0 0 1px rgba(255,255,255,.25);
            }
            body.dark-theme .app-container {
                border: 1px solid rgba(148,163,184,.25);
                box-shadow:
                    0 30px 70px -15px rgba(3,6,18,.9),
                    0 0 90px rgba(124,58,237,.25),
                    inset 0 0 0 1px rgba(120,120,255,.08);
            }
        }

        /* 3. ARKA PLAN DESENİ */
        .bg-pattern {
            position: absolute; inset: 0;
            opacity: 0.14;
            background-image:
                radial-gradient(rgba(120,120,255,.5) 1.4px, transparent 1.4px),
                radial-gradient(rgba(80,180,255,.4) 1.4px, transparent 1.4px);
            background-size: 46px 46px;
            background-position: 0 0, 23px 23px;
            pointer-events: none; z-index: 0;
        }

        .card-perspective { perspective: 1100px; }

        /* 4. REDAKSIYONAL KART */
        .main-card {
            width: 100%;
            max-width: 280px;
            aspect-ratio: 2 / 2.8;
            background: linear-gradient(160deg, rgba(255,255,255,.55), rgba(240,245,255,.25));
            backdrop-filter: blur(14px) saturate(150%);
            -webkit-backdrop-filter: blur(14px) saturate(150%);
            border-radius: 26px;
            position: relative;
            border: 1px solid rgba(255,255,255,.85);
            box-shadow:
                0 24px 48px -14px rgba(80,80,220,.28),
                inset 0 0 0 1px rgba(255,255,255,.55),
                inset 0 1px 12px rgba(255,255,255,.5);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 1.5rem; text-align: center;
            transition: transform .5s cubic-bezier(.34,1.56,.64,1), box-shadow .3s, border-color .3s, background .3s;
            transform-style: preserve-3d;
            margin: auto;
        }
        body.dark-theme .main-card {
            background: linear-gradient(160deg, rgba(30,41,59,.72), rgba(15,23,42,.55));
            border: 1px solid rgba(148,163,184,.3);
            box-shadow:
                0 24px 52px -12px rgba(0,0,0,.7),
                0 0 40px rgba(99,102,241,.22),
                inset 0 1px 12px rgba(139,92,246,.12);
        }

        .main-card.drop-hover {
            transform: scale(1.05);
            border-color: var(--acc-1);
            box-shadow:
                0 28px 55px rgba(99,102,241,.4),
                0 0 45px rgba(139,92,246,.35);
            background: linear-gradient(160deg, rgba(99,102,241,.28), rgba(217,70,239,.2));
        }

        .card-idle { transform: scale(1) rotateY(0deg); opacity: 1; }
        .card-flip-out { transform: scale(.9) rotateY(-90deg) translateY(-20px); opacity: 0; }
        .card-flip-in { transform: scale(.9) rotateY(90deg) translateY(20px); opacity: 0; }

        /* 5. SEÇENEK KARTLARI (Draggable) */
        .fan-container {
            display: flex; justify-content: center; align-items: flex-end;
            width: 100%; height: 180px; position: relative; padding-bottom: 2rem;
        }

        .choice-draggable-card {
            width: 95px;
            aspect-ratio: 2 / 2.8;
            background: linear-gradient(170deg, rgba(255,255,255,.82), rgba(235,241,255,.4));
            backdrop-filter: blur(10px) saturate(150%);
            -webkit-backdrop-filter: blur(10px) saturate(150%);
            border: 1px solid rgba(255,255,255,.7);
            border-radius: 18px;
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: .5rem; text-align: center;
            box-shadow: 0 12px 26px -8px rgba(80,80,220,.22), inset 0 1px 8px rgba(255,255,255,.55);
            color: #475569;
            cursor: grab;
            transform-origin: bottom center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        body.dark-theme .choice-draggable-card {
            background: linear-gradient(170deg, rgba(30,41,66,.85), rgba(15,23,42,.6));
            border-color: rgba(148,163,184,.3);
            box-shadow: 0 14px 30px -8px rgba(0,0,0,.65), inset 0 1px 10px rgba(255,137,208,.08);
            color: #cbd5e1;
        }

        .choice-draggable-card:active { cursor: grabbing; }

        .choice-draggable-card.dragging {
            box-shadow:
                0 34px 70px -12px rgba(99,102,241,.45),
                0 0 0 2px var(--acc-3),
                0 0 45px rgba(217,70,239,.35);
            opacity: .96;
            transform: scale(1.06);
            background: linear-gradient(160deg, rgba(99,102,241,.3), rgba(217,70,239,.28));
        }
        body.dark-theme .choice-draggable-card.dragging {
            background: linear-gradient(160deg, rgba(99,102,241,.55), rgba(217,70,239,.5));
        }

        .choice-draggable-card:disabled,
        body.dark-theme .choice-draggable-card:disabled {
            opacity: .5;
            filter: grayscale(90%);
            border-color: rgba(255,255,255,.2);
            cursor: not-allowed;
            touch-action: auto;
        }

        /* 6. ALT MENÜ */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 65px;
            background: rgba(255,255,255,.4);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border-top: 1px solid rgba(255,255,255,.6);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 40;
            border-bottom-left-radius: 2.5rem; border-bottom-right-radius: 2.5rem;
        }
        body.dark-theme .bottom-nav {
            background: rgba(9,14,28,.7);
            border-top-color: rgba(99,102,241,.3);
        }

        .nav-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 19%; height: 80%;
            border-radius: 14px; font-weight: 800; font-size: 9px;
            color: #94a3b8;
            transition: all .2s cubic-bezier(.4,0,.2,1);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, rgba(99,102,241,.32), rgba(217,70,239,.28));
            border: 1px solid rgba(139,92,246,.45);
            box-shadow:
                inset 0 0 14px rgba(255,255,255,.35),
                0 6px 18px rgba(99,102,241,.25);
            color: var(--acc-1);
            transform: translateY(-2px);
        }
        body.dark-theme .nav-btn.active {
            background: linear-gradient(135deg, rgba(99,102,241,.4), rgba(217,70,239,.35));
            box-shadow: 0 6px 20px rgba(99,102,241,.3), inset 0 0 1px rgba(148,163,184,.2);
            color: #a5b4fc;
        }

        .nav-btn i { font-size: 15px; margin-bottom: 2px; }

        /* 7. FİT BAZL: STOVE / EKRAN OVERLAYLER */
        .stats-overlay {
            position: absolute; top: 0; left: 0; width: 100%;
            height: calc(100% - 65px);
            background: rgba(255,255,255,.55);
            backdrop-filter: blur(28px) saturate(170%);
            -webkit-backdrop-filter: blur(28px) saturate(170%);
            border-bottom: 1px solid rgba(255,255,255,.6);
            z-index: 35;
            display: flex; flex-direction: column;
            padding: 2rem 1.5rem; overflow-y: auto;
            animation: slideUp .3s cubic-bezier(.34,1.56,.64,1) forwards;
            color: #334155;
        }
        body.dark-theme .stats-overlay {
            background: rgba(4,8,20,.86);
            border-bottom-color: rgba(99,102,241,.28);
            color: #e2e8f0;
        }

        @keyframes slideUp {
            from { transform: translateY(10%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .stat-bar-bg {
            width: 100%; height: 12px;
            background: rgba(255,255,255,.55);
            border: 1px solid rgba(255,255,255,.7);
            box-shadow: inset 0 2px 4px rgba(0,0,0,.03);
            border-radius: 6px; overflow: hidden; margin-top: 4px;
        }
        body.dark-theme .stat-bar-bg { background: rgba(30,41,59,.55); border-color: rgba(100,116,139,.3); }

        .stat-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--acc-4), var(--acc-1), var(--acc-3));
            transition: width .5s ease-out;
        }

        /* ---- DARK MODE: inline Tailwind chips / text normalization ---- */
        body.dark-theme [class*="text-slate-700"] { color: #e2e8f0; }
        body.dark-theme [class*="text-slate-600"] { color: #cbd5e1; }
        body.dark-theme [class*="text-slate-500"] { color: #94a3b8; }
        body.dark-theme [class*="text-slate-400"] { color: #64748b; }
        body.dark-theme [class*="text-slate-300"] { color: #94a3b8; }

        body.dark-theme [class*="from-slate-600"] {
            background-image: linear-gradient(90deg, #818cf8, #e2e8f0) !important;
        }
        body.dark-theme [class*="from-slate"] { color: #cbd5e1; }
        body.dark-theme [class*="to-slate"]   { color: #94a3b8; }

        body.dark-theme [class*="bg-white/"]   { background-color: rgba(26,38,68,.72); }
        body.dark-theme [class*="border-white/"] { border-color: rgba(148,163,184,.28); }

        /* Keep light surface buttons (close etc.) readable on dark */
        body.dark-theme [class*="bg-slate-200"] { background-color: #273047; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
__BODY__
    </script>
</body>
</html>
