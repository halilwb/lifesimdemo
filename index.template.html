<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📼 Türkiye Yaşam Simülatörü</title>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Retro/Vintage font stack -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Retro color palette -->
    <style>
        /* ===== RETRO STYLE (Vintage Computer/CRT Monitor) ===== */
        :root {
            /* Retro color palette */
            --retro-bg: #f5f3e8;      /* Cream/off-white */
            --retro-panel: #e8e3d9;   /* Light beige */
            --retro-accent: #d4c7b8;  /* Muted tan */
            --retro-border: #b8a99a;  /* Warm gray-brown */
            --retro-green: #8a9a5b;   /* Olive green */
            --retro-orange: #cc7a43;  /* Burnt orange */
            --retro-red: #a65f46;     /* Terra cotta */
            --retro-blue: #6b8e9a;    /* Dusty blue */
            --retro-yellow: #d4a017;  /* Goldenrod */
            --retro-dark: #3e3228;    /* Dark brown */
        }

        /* Body with retro paper texture */
        body {
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; min-height: 100dvh;
            color: #3e3228;
            overflow: hidden;
            background: var(--retro-bg);
            /* Subtle paper texture */
            background-image:
                radial-gradient(circle at 20% 30%, rgba(240,235,225,.3) 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(230,225,215,.2) 0%, transparent 25%);
        }

        /* Dark mode alternative (retro monitor dark) */
        body.dark-theme {
            background: #2a251e;      /* Very dark beige */
            color: #e8e3d9;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(42,37,30,.4) 0%, transparent 20%),
                radial-gradient(circle at 80% 70%, rgba(38,33,28,.3) 0%, transparent 25%);
        }

        /* Custom scrollbar with retro styling */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(200,190,170,.3);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(160,140,120,.6);
            border-radius: 3px;
            border: 1px solid rgba(140,120,100,.4);
        }

        /* Main app container with retro monitor/bezel effect */
        .app-container {
            width: 100%;
            height: 100dvh;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: var(--retro-panel);
            backdrop-filter: blur(2px) saturate(110%);
            -webkit-backdrop-filter: blur(2px) saturate(110%);
            border: 3px solid var(--retro-border);
            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,.1),
                0 4px 8px rgba(0,0,0,.15);
            position: relative;
        }

        /* Monitor bezel/stand effect */
        .app-container::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 6px;
            background: var(--retro-dark);
            border-radius: 3px;
            box-shadow: 0 2px 4px rgba(0,0,0,.2);
        }

        .app-container::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 8px;
            background: var(--retro-dark);
            border-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,.2);
        }

        body.dark-theme .app-container {
            background: #352e25;      /* Slightly lighter dark */
            border-color: #5a4b3e;
        }

        /* Responsive sizing with retro proportions */
        @media (min-width: 640px) {
            .app-container {
                width: 420px;
                height: 800px;
                max-height: 90vh;
                border-radius: 0;     /* Sharp corners for retro monitor look */
                border: 4px solid var(--retro-border);
                box-shadow:
                    0 8px 16px -4px rgba(0,0,0,.25),
                    0 0 0 1px rgba(0,0,0,.08),
                    inset 0 0 0 1px rgba(255,255,255,.15);
            }
            body.dark-theme .app-container {
                border: 4px solid #5a4b3e;
                box-shadow:
                    0 10px 20px -5px rgba(0,0,0,.35),
                    0 0 0 1px rgba(0,0,0,.12);
            }
        }

        /* Subtle screen glare/reflection */
        .bg-pattern {
            position: absolute; inset: 0;
            opacity: 0.08;
            background-image:
                radial-gradient(ellipse at center, rgba(255,255,255,.15) 0%, transparent 70%);
            pointer-events: none; z-index: 1;
        }

        /* Main card with retro panel styling */
        .main-card {
            width: 100%;
            max-width: 280px;
            aspect-ratio: 2 / 2.8;
            background: var(--retro-accent);
            border: 2px solid var(--retro-border);
            border-radius: 12px;
            position: relative;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 1.5rem; text-align: center;
            transform-style: preserve-3d;
            margin: auto;
            box-shadow:
                0 4px 8px rgba(0,0,0,.15),
                inset 0 0 0 1px rgba(255,255,255,.3);
            /* Subtle noise/grain */
            background-image:
                url-data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9IiNmZmYiLz48cmVjdCB3aWR0aD0iMSIgaGVpZ2h0PSIxIiBmaWxsPSIjZGVmIi8+PHJlY3QgeD0iMiIgZmlsbD0iI2RlZiIvPjwvc3ZnPg==;
        }

        body.dark-theme .main-card {
            background: #4a4033;      /* Darker panel */
            border-color: #6b5a48;
            box-shadow:
                0 4px 8px rgba(0,0,0,.25),
                inset 0 0 0 1px rgba(255,255,255,.1);
        }

        /* Interactive states */
        .main-card.drop-hover {
            transform: scale(1.02);
            border-color: var(--retro-orange);
            box-shadow:
                0 6px 12px rgba(204,122,67,.3),
                inset 0 0 0 1px rgba(255,255,255,.4);
            background: var(--retro-yellow);
            background-image:
                url-data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9IiNmZmYiLz48cmVjdCB3aWR0aD0iMSIgaGVpZ2h0PSIxIiBmaWxsPSIjZGVmIi8+PHJlY3QgeD0iMiIgZmlsbD0iI2RlZiIvPjwvc3ZnPg==;
        }

        /* Card flip animations */
        .card-idle { transform: scale(1) rotateY(0deg); opacity: 1; }
        .card-flip-out { transform: scale(.9) rotateY(-90deg) translateY(-20px); opacity: 0; }
        .card-flip-in { transform: scale(.9) rotateY(90deg) translateY(20px); opacity: 0; }

        /* Choice cards with retro button styling */
        .fan-container {
            display: flex; justify-content: center; align-items: flex-end;
            width: 100%; height: 180px; position: relative; padding-bottom: 2rem;
        }

        .choice-draggable-card {
            width: 95px;
            aspect-ratio: 2 / 2.8;
            background: var(--retro-panel);
            border: 2px solid var(--retro-border);
            border-radius: 10px;
            position: relative;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: .5rem; text-align: center;
            box-shadow: 0 4px 8px -2px rgba(0,0,0,.2), inset 0 1px 4px rgba(255,255,255,.4);
            color: var(--retro-dark);
            cursor: grab;
            transform-origin: bottom center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            font-family: 'VT323', monospace;
            letter-spacing: 0.5px;
            /* Subtle texture */
            background-image:
                url-data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0IiBoZWlnaHQ9IjQiPjxyZWN0IHdpZHRoPSI0IiBoZWlnaHQ9IjQiIGZpbGw9IiNmZmYiLz48cmVjdCB3aWR0aD0iMSIgaGVpZ2h0PSIxIiBmaWxsPSIjZGVmIi8+PHJlY3QgeD0iMiIgZmlsbD0iI2RlZiIvPjwvc3ZnPg==;
        }

        body.dark-theme .choice-draggable-card {
            background: #352e25;
            border-color: #5a4b3e;
            box-shadow: 0 4px 8px -2px rgba(0,0,0,.3), inset 0 1px 4px rgba(255,255,255,.1);
            color: #e8e3d9;
        }

        .choice-draggable-card:active { cursor: grabbing; }

        .choice-draggable-card.dragging {
            box-shadow:
                0 8px 16px -4px rgba(0,0,0,.3),
                0 0 0 2px var(--retro-orange),
                0 0 12px rgba(212,162,104,.4);
            opacity: .95;
            transform: scale(1.04);
            background: var(--retro-yellow);
            border-color: var(--retro-orange);
        }
        body.dark-theme .choice-draggable-card.dragging {
            background: #8b7355;      /* Warm brown */
            border-color: #a65f46;    /* Terra cotta */
        }

        .choice-draggable-card:disabled,
        body.dark-theme .choice-draggable-card:disabled {
            opacity: .6;
            filter: grayscale(80%);
            border-color: rgba(184,169,154,.3);
            cursor: not-allowed;
            touch-action: auto;
        }

        /* Bottom navigation with retro styling */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 55px;
            background: var(--retro-panel);
            backdrop-filter: blur(2px) saturate(110%);
            -webkit-backdrop-filter: blur(2px) saturate(110%);
            border-top: 2px solid var(--retro-border);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 40;
        }
        body.dark-theme .bottom-nav {
            background: #352e25;
            border-top-color: #5a4b3e;
        }

        .nav-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 19%; height: 80%;
            border-radius: 8px; font-weight: 700; font-size: 8px;
            color: #7a6b5a;
            transition: all .15s cubic-bezier(.4,0,.2,1);
            border: 1px solid transparent;
            background: var(--retro-accent);
        }

        .nav-btn.active {
            background: var(--retro-yellow);
            border: 2px solid var(--retro-orange);
            color: var(--retro-dark);
            box-shadow: 0 2px 4px rgba(0,0,0,.2);
            transform: translateY(-1px);
        }
        body.dark-theme .nav-btn.active {
            background: #8b7355;
            border-color: #a65f46;
            color: #f5f3e8;
        }

        .nav-btn i { font-size: 14px; margin-bottom: 1px; }

        /* Stats overlay with retro window styling */
        .stats-overlay {
            position: absolute; top: 0; left: 0; width: 100%;
            height: calc(100% - 55px);
            background: var(--retro-panel);
            backdrop-filter: blur(2px) saturate(110%);
            -webkit-backdrop-filter: blur(2px) saturate(110%);
            border-bottom: 2px solid var(--retro-border);
            z-index: 35;
            display: flex; flex-direction: column;
            padding: 1.5rem 1rem; overflow-y: auto;
            animation: slideUp .3s cubic-bezier(.34,1.56,.64,1) forwards;
            color: var(--retro-dark);
            font-family: 'VT323', monospace;
        }
        body.dark-theme .stats-overlay {
            background: #352e25;
            border-bottom-color: #5a4b3e;
            color: #e8e3d9;
        }

        @keyframes slideUp {
            from { transform: translateY(8%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .stat-bar-bg {
            width: 100%; height: 10px;
            background: var(--retro-accent);
            border: 1px solid var(--retro-border);
            box-shadow: inset 0 1px 2px rgba(0,0,0,.05);
            border-radius: 4px; overflow: hidden; margin-top: 3px;
        }
        body.dark-theme .stat-bar-bg {
            background: #4a4033;
            border-color: #6b5a48;
        }

        .stat-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--retro-green), var(--retro-yellow), var(--retro-orange));
            transition: width .5s ease-out;
        }

        /* Retro text styling for dark mode normalization */
        body.dark-theme [class*="text-slate-700"] { color: #e8e3d9; }
        body.dark-theme [class*="text-slate-600"] { color: #d4c9b8; }
        body.dark-theme [class*="text-slate-500"] { color: #b8a99a; }
        body.dark-theme [class*="text-slate-400"] { color: #a69280; }
        body.dark-theme [class*="text-slate-300"] { color: #b8a99a; }

        body.dark-theme [class*="from-slate-600"] {
            background-image: linear-gradient(90deg, #b8a99a, #e8e3d9) !important;
        }
        body.dark-theme [class*="from-slate"] { color: #d4c9b8; }
        body.dark-theme [class*="to-slate"]   { color: #b8a99a; }

        body.dark-theme [class*="bg-white/"]   { background-color: rgba(42,38,30,.7); }
        body.dark-theme [class*="border-white/"] { border-color: rgba(168,154,138,.2); }

        /* Keep surface elements readable on dark */
        body.dark-theme [class*="bg-slate-200"] { background-color: #4a4033; }

        /* Add subtle scanline effect for CRT feel */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 1px,
                    rgba(0,0,0,.02) 1px,
                    rgba(0,0,0,.02) 2px
                );
            opacity: 0.3;
            z-index: 9999;
        }

        body.dark-theme::after {
            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 1px,
                    rgba(255,255,255,.01) 1px,
                    rgba(255,255,255,.01) 2px
                );
        }

        /* Add slight curvature to simulate CRT screen */
        .app-container {
            border-radius: 0 !important;
        }

        /* Retro font enhancements */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Press Start 2P', cursive;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Button hover effects */
        .nav-btn:hover:not(.active) {
            background: var(--retro-yellow);
            border-color: var(--retro-orange);
            transform: translateY(-1px);
        }
        body.dark-theme .nav-btn:hover:not(.active) {
            background: #8b7355;
            border-color: #a65f46;
        }

        /* Add slight vignette effect */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,.1) 100%);
            z-index: 9998;
            opacity: 0;
            transition: opacity 0.3s;
        }

        body:hover::before {
            opacity: 0.05;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
__BODY__
    </script>
</body>
</html>
